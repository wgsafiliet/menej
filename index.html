<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SmartFin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="description" content="Smart Financial Manager — asisten keuangan pintar: dana darurat, kontrol anggaran, pengingat tagihan, prediksi cashflow, skor kesehatan keuangan, dan notifikasi cerdas. Data tersimpan lokal & tersinkron ke Google Sheets Anda.">
<title>SmartFin — Manajer Keuangan Pintar</title>
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --pri:#0f9d6b; --pri-d:#0c8159; --pri-l:#e7f7ee;
  --amber:#e8780a; --amber-l:#fdf0dd;
  --red:#d93b3b; --red-l:#fdeaea;
  --blue:#2f6fd6; --blue-l:#e8f0fc;
  --ink:#1a2332; --mut:#5a6a7e; --mut2:#8a98ab;
  --bg:#f3f6f9; --card:#fff; --line:#e7ecf2; --line2:#eef2f7;
  --sh:0 1px 3px rgba(20,40,80,.06),0 4px 16px rgba(20,40,80,.05);
  --r:16px; --r-s:11px; --r-l:22px;
  --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
  background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.5;overscroll-behavior-y:none}
img{max-width:100%;height:auto}
a{color:var(--pri)}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:var(--fs);color:var(--ink)}
.r{font-variant-numeric:tabular-nums}
/* ===================== LAYOUT ===================== */
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:74px}
@media(min-width:960px){
  body{background:#e9eef4}
  .app{max-width:1180px;display:grid;grid-template-columns:248px 1fr;padding-bottom:0;min-height:100vh;box-shadow:0 0 40px rgba(20,40,80,.08)}
  .app::before{content:"";display:none}
  .side{display:flex!important;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:18px 14px}
  .navbot{display:none!important}
  .topbar .brand small{display:inline}
  .wrap{padding:22px 26px}
}
.side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:6px 4px 14px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--pri),#34d399);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(15,157,107,.35)}
.brand b{font-size:17px;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--mut);font-weight:600;font-size:14px;text-decoration:none}
.nav a .ic{width:21px;height:21px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--pri-l);color:var(--pri-d)}
.nav a:hover:not(.on){background:var(--line2)}
.navbot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}
.navbot .in{display:flex;width:100%;max-width:560px}
.navbot a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--mut2);font-size:10px;font-weight:600;text-decoration:none}
.navbot a .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbot a.on{color:var(--pri)}
.navbot a.more .ic{stroke-width:1.6}
/* ===================== TOPBAR ===================== */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;background:var(--bg);position:sticky;top:0;z-index:20}
.topbar .brand{padding:0}
.topbar .sp{flex:1}
.topbar .month{font-size:13px;color:var(--mut);font-weight:600;background:var(--card);padding:7px 12px;border-radius:20px;border:1px solid var(--line)}
.topbar .bell{position:relative;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.topbar .bell .ic{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.topbar .bell .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:none}
.topbar .bell.has .dot{display:block}
.wrap{padding:14px 16px 26px}
/* ===================== CARDS & UI ===================== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card.tight{padding:13px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:18px;height:18px;fill:none;stroke:var(--pri);stroke-width:1.9}
.card h3 a.ml{margin-left:auto;font-size:12px;color:var(--pri);font-weight:700;text-decoration:none}
.muted{color:var(--mut)}
.sm{font-size:12px}
.xs{font-size:11px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.between{justify-content:space-between}
.center{align-items:center}
.wrap-flex{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--line2);color:var(--mut)}
.chip.g{background:var(--pri-l);color:var(--pri-d)}
.chip.a{background:var(--amber-l);color:var(--amber)}
.chip.r{background:var(--red-l);color:var(--red)}
.chip.b{background:var(--blue-l);color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:14px;text-decoration:none;border:0;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost .ic{stroke:var(--ink)}
.btn.danger{background:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:16px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(15,157,107,.45);z-index:25}
@media(min-width:960px){.fab{right:30px;bottom:30px}}
.fab .ic{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* big number */
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.big.sm2{font-size:21px}
.lg-num{font-size:34px;font-weight:800;letter-spacing:-1px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .b{background:var(--card);border-radius:13px;padding:12px;box-shadow:var(--sh)}
.kpi .b .lbl{font-size:11px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .b .v{font-size:18px;font-weight:800;margin-top:4px}
.kpi .b.in .v{color:var(--pri)} .kpi .b.out .v{color:var(--red)} .kpi .b.bal .v{color:var(--blue)}
/* progress */
.prog{height:9px;border-radius:6px;background:var(--line2);overflow:hidden}
.prog .f{height:100%;border-radius:6px;background:var(--pri);transition:width .4s}
.prog .f.a{background:var(--amber)} .prog .f.r{background:var(--red)} .prog .f.b{background:var(--blue)}
.bar-row{margin-bottom:13px}
.bar-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-row .top .nm{font-weight:600;display:flex;align-items:center;gap:6px}
.bar-row .top .nm .d{width:8px;height:8px;border-radius:50%}
.bar-row .top .v{font-weight:700;font-variant-numeric:tabular-nums}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .ic-c{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:var(--line2)}
.li .nm{font-weight:600;font-size:14px;line-height:1.2}
.li .sb{font-size:12px;color:var(--mut)}
.li .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.li .v.in{color:var(--pri)} .li .v.out{color:var(--ink)}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty .ic{width:48px;height:48px;opacity:.35;margin:0 auto 10px;fill:none;stroke:var(--mut);stroke-width:1.5}
/* score ring */
.ring{position:relative;width:130px;height:130px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr .n{font-size:34px;font-weight:800;line-height:1}
.ring .ctr .l{font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
/* notification */
.notif{display:flex;gap:11px;padding:12px;border-radius:13px;background:var(--card);margin-bottom:9px;box-shadow:var(--sh);border-left:4px solid var(--mut)}
.notif.crit{border-left-color:var(--red)} .notif.hi{border-left-color:var(--amber)} .notif.mid{border-left-color:var(--blue)} .notif.lo{border-left-color:var(--pri)}
.notif .em{font-size:20px;flex-shrink:0;line-height:1.2}
.notif .bd{flex:1;min-width:0}
.notif .bd .t{font-weight:700;font-size:13px;line-height:1.25}
.notif .bd .m{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.4}
.notif .bd .mt{font-size:10px;color:var(--mut2);margin-top:5px;display:flex;gap:6px;align-items:center}
.notif .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.notif .act button{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--line2);color:var(--mut)}
.notif .act button.pri{background:var(--pri-l);color:var(--pri-d)}
.notif.read{opacity:.6}
.notif.read .t{font-weight:600}
/* forms / inputs */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.fld input.rp{text-align:right;font-weight:600}
.seg{display:flex;gap:6px;background:var(--line2);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
/* modal / bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(15,25,45,.5);z-index:40;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;z-index:41;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(100%);transition:transform .25s,opacity .2s,visibility .2s;max-height:92vh;overflow-y:auto;padding:8px 16px 24px}
.sheet.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
.sheet .handle{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:18px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:16px;color:var(--mut)}
@media(min-width:960px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%) translateY(30px);border-radius:18px;width:520px;max-width:92vw;box-shadow:0 20px 60px rgba(15,25,45,.3)}
  .sheet.on{transform:translate(-50%,-50%)}
}
/* amount picker (tap instead of type) */
.amt-row{display:flex;gap:8px}
.amt-row input{flex:1}
.amt-row .amt-clr{width:46px;flex-shrink:0;border-radius:11px;background:var(--line2);color:var(--mut);font-size:20px;font-weight:700;line-height:1}
.amt-row .amt-clr:active{background:var(--red-l);color:var(--red)}
.amt-pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.amt-pick .amt-c{padding:8px 12px;border-radius:10px;background:var(--pri-l);color:var(--pri-d);font-weight:700;font-size:12.5px;min-width:48px}
.amt-pick .amt-c:active{transform:scale(.94);background:var(--pri);color:#fff}
.amt-disp{font-size:12px;color:var(--mut);margin-top:6px;font-weight:600}
.quick-names{display:flex;flex-wrap:wrap;gap:7px;margin-top:-4px;margin-bottom:12px}
.quick-names button{padding:6px 12px;border-radius:20px;background:var(--line2);color:var(--mut);font-size:12px;font-weight:600}
.quick-names button:active{background:var(--pri-l);color:var(--pri-d)}
/* toast */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90%;text-align:center}
@media(min-width:960px){#toast{bottom:30px}}
/* status banner */
.banner{border-radius:13px;padding:12px 13px;font-size:13px;font-weight:600;display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}
.banner .em{font-size:17px;flex-shrink:0}
.banner.g{background:var(--pri-l);color:var(--pri-d)} .banner.a{background:var(--amber-l);color:var(--amber)} .banner.r{background:var(--red-l);color:var(--red)} .banner.b{background:var(--blue-l);color:var(--blue)}
/* statusbar (sync) */
#sb{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;font-size:12px;z-index:35;display:none;padding:9px 16px;align-items:center;gap:10px}
#sb .r{margin-left:auto;display:flex;gap:6px}
#sb button{background:#ffffff22;color:#fff;border-radius:8px;padding:6px 11px;font-size:11px;font-weight:700}
@media(min-width:960px){#sb{bottom:0;left:248px}}
#dot{position:fixed;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--pri);z-index:70;display:none}
#dot.x{display:block;background:var(--amber);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
/* health breakdown */
.hb{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line2)}
.hb:last-child{border-bottom:0}
.hb .nm{color:var(--mut)} .hb .v{font-weight:700}
/* mini donut legend */
.legend{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.legend .it{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend .it .d{width:10px;height:10px;border-radius:3px}
.legend .it .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:10.5px;font-weight:600}
.qa a .c{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--pri-l);color:var(--pri-d)}
.qa a .c .ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qa a:nth-child(2) .c{background:var(--red-l);color:var(--red)}
.qa a:nth-child(3) .c{background:var(--blue-l);color:var(--blue)}
.qa a:nth-child(4) .c{background:var(--amber-l);color:var(--amber)}
.qa a:nth-child(5) .c{background:#f0eafc;color:#7c5fd6}
/* misc */
.hdr{font-size:18px;font-weight:800;padding:4px 0 10px;letter-spacing:-.3px}
.hdr .sub{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px;letter-spacing:0}
.div{height:1px;background:var(--line);margin:12px 0}
.toggle{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);flex-shrink:0;transition:.2s}
.toggle.on{background:var(--pri)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.toggle.on::after{left:21px}
.tg-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.tg-row:last-child{border-bottom:0}
.tg-row .lb{font-size:13.5px;font-weight:600} .tg-row .lb small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:1px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs button{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.hint{font-size:12px;color:var(--mut);background:var(--blue-l);border-radius:10px;padding:10px 12px;line-height:1.5}
.hint b{color:var(--blue)}
.tag-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.collapsible summary{cursor:pointer;font-weight:700;font-size:13px;padding:8px 0;list-style:none;display:flex;align-items:center;gap:6px}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible summary::after{content:"▸";margin-left:auto;color:var(--mut);transition:.2s}
.collapsible[open] summary::after{transform:rotate(90deg)}
.hl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:var(--line2);margin-bottom:8px}
.hl .ic-c{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--card)}
.hl .nm{font-weight:600;font-size:13.5px} .hl .sb{font-size:11.5px;color:var(--mut)}
.hl .v{margin-left:auto;font-weight:700}
.hidden{display:none!important}
.alo-bar{height:30px;border-radius:8px;overflow:hidden;display:flex;margin:10px 0 6px}
.alo-bar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden}
.alo-tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.alo-tbl th,.alo-tbl td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line2)}
.alo-tbl th{font-size:11px;color:var(--mut)} .alo-tbl td.r,.alo-tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--pri),#0c8159);display:grid;place-items:center;z-index:90;text-align:center;color:#fff}
.splash .lg{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:34px;font-weight:800;margin:0 auto 16px;backdrop-filter:blur(6px)}
.splash b{font-size:22px}
.splash p{opacity:.85;font-size:13px;margin-top:6px}
.view{display:none}.view.on{display:block}
/* kartu rekomendasi (dashboard & perencana) */
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec .rc{background:var(--line2);border-radius:12px;padding:10px 12px;min-width:0}
.rec .rc .lbl{font-size:11px;color:var(--mut);font-weight:600}
.rec .rc .v{font-size:15.5px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.rec .rc .sb{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.35}

<script>
/* ===================== APP CORE ===================== */
// data tersimpan lokal di perangkat ini (localStorage)
// $ sebagai function declaration (bukan const) agar terpasang di window &
// pasti terjangkau dari onclick inline maupun badan fungsi di semua browser.
function $(i){ return document.getElementById(i); }
const R = n => 'Rp' + (Math.round(+n||0)).toLocaleString('id-ID');
const Rs = n => 'Rp ' + Math.round(+n||0).toLocaleString('id-ID');
const E = s => String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const L = (k,v) => { try{ return v===undefined ? JSON.parse(localStorage.getItem(k)) : localStorage.setItem(k,JSON.stringify(v)); }catch(e){return null;} };
const uid = p => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const uid2 = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = s => +String(s||'').replace(/[^\d.-]/g,'') || 0;
const rp2num = s => +String(s||'').replace(/[^\d]/g,'') || 0;
const todayISO = () => new Date().toISOString().slice(0,10);
const dtISO = () => new Date().toISOString().slice(0,16);
const monthKey = d => (d||new Date()).toISOString().slice(0,7);
const fmtDate = d => { if(!d) return '-'; const x=new Date(d); if(isNaN(x)) return String(d); return x.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
const fmtDateShort = d => { if(!d) return '-'; const x=new Date(d); if(isNaN(x)) return String(d); return x.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); };
const daysUntil = d => { if(!d) return Infinity; const x=new Date(d); x.setHours(0,0,0,0); const n=new Date(); n.setHours(0,0,0,0); return Math.round((x-n)/86400000); };
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS_L = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

// State
let S = { tab:'dash', d:null, q:[], busy:0, modal:null, filterMonth:monthKey(), edit:null };
const D = () => S.d || DEMO;

// ===== default kategori & konfigurasi awal =====
const DEF_KAT = [
  {id:'k1',nama:'Gaji',tipe:'in',ikon:'💼',warna:'#0f9d6b'},
  {id:'k2',nama:'Freelance',tipe:'in',ikon:'🧾',warna:'#34d399'},
  {id:'k3',nama:'Bisnis',tipe:'in',ikon:'🏪',warna:'#10b981'},
  {id:'k4',nama:'Lain-lain',tipe:'in',ikon:'➕',warna:'#22c55e'},
  {id:'k10',nama:'Makan',tipe:'out',ikon:'🍽️',warna:'#ef4444'},
  {id:'k11',nama:'Belanja',tipe:'out',ikon:'🛒',warna:'#f97316'},
  {id:'k12',nama:'Transportasi',tipe:'out',ikon:'🛵',warna:'#e8780a'},
  {id:'k13',nama:'Hiburan',tipe:'out',ikon:'🎬',warna:'#a855f7'},
  {id:'k14',nama:'Tagihan',tipe:'out',ikon:'🧾',warna:'#2f6fd6'},
  {id:'k15',nama:'Kesehatan',tipe:'out',ikon:'💊',warna:'#06b6d4'},
  {id:'k16',nama:'Cicilan/Utang',tipe:'out',ikon:'💳',warna:'#dc2626'},
  {id:'k17',nama:'Tabungan',tipe:'out',ikon:'🐷',warna:'#0f9d6b'},
  {id:'k18',nama:'Lain-lain',tipe:'out',ikon:'📦',warna:'#8a98ab'}
];
const DEF_DD = [
  {id:'dd1',kategori_kebutuhan:'Makan',jumlah_bulanan:2000000},
  {id:'dd2',kategori_kebutuhan:'Tempat tinggal',jumlah_bulanan:1000000},
  {id:'dd3',kategori_kebutuhan:'Listrik & air',jumlah_bulanan:300000},
  {id:'dd4',kategori_kebutuhan:'Transportasi',jumlah_bulanan:500000},
  {id:'dd6',kategori_kebutuhan:'Kebutuhan lain',jumlah_bulanan:700000}
];
const DEF_SET = {
  nama:'Pengguna', matauang:'IDR', penghasilanBulanan:0, // 0 = belum diisi (tanpa angka contoh)
  alokasi:{kebutuhan:50,tabungan:20,investasi:10,hiburan:15,bebas:5},
  notif:{danaDarurat:1,anggaran:1,tagihan:1,cashflow:1,target:1,langganan:1,abnormal:1,tidakCatat:1,evaluasi:1,gaji:1,utang:1},
  tenang:{on:0,mulai:'22:00',selesai:'07:00'},
  danaDaruratRekening:'' // rekening yang dianggap dana darurat (opsional); bila kosong = dihitung dari tabungan
};
// Templat data KOSONG — aplikasi mulai dari kosong; angka hanya muncul setelah
// pengguna mengisinya (transaksi, rekening, pengaturan). Kategori bawaan & satu
// rekening nol-saldo hanyalah kerangka agar bisa langsung mencatat transaksi.
const KOSONG = {
  ver:2,
  rekening:[{id:'r1',nama:'Rekening utama',jenis:'Bank',saldo_awal:0}],
  kategori:DEF_KAT.slice(),
  transaksi:[], anggaran:[], tagihan:[], utang:[], target:[], danaDarurat:[],
  pengaturan:JSON.parse(JSON.stringify(DEF_SET)),
  notifikasi:[]
};
const DEMO = KOSONG; // nama lama dipertahankan demi kompatibilitas internal

/* ===================== DATA LAYER (local-first + sinkron Google Sheets) ===================== */
// URL Apps Script ditanam langsung di sini (tanpa UI pengaturan).
// Data SELALU disimpan dulu ke localStorage perangkat, lalu disinkronkan ke
// Google Sheets di latar belakang (best-effort). Kalau Sheets gangguan/offline,
// data tetap aman di perangkat & dicoba ulang saat koneksi pulih.
const API = 'https://script.google.com/macros/s/AKfycbw0kgkqxGkKGtyEX1VKr6Yp6LYLqj0mB7u3M1l2hsJD6-sxMVhcVvnDxnwGgp707xg/exec';

function normalizeD(d){
  d = d || {};
  d.rekening = d.rekening || [];
  d.kategori = (d.kategori && d.kategori.length) ? d.kategori : DEF_KAT.slice();
  d.transaksi = d.transaksi || [];
  d.anggaran = d.anggaran || [];
  d.tagihan = d.tagihan || [];
  d.utang = d.utang || [];
  d.target = d.target || [];
  d.danaDarurat = d.danaDarurat || []; // kosong sampai diisi pengguna (DEF_DD hanya contoh opsional)
  d.pengaturan = Object.assign(JSON.parse(JSON.stringify(DEF_SET)), d.pengaturan||{});
  d.pengaturan.notif = Object.assign(DEF_SET.notif, d.pengaturan.notif||{});
  d.pengaturan.tenang = Object.assign(DEF_SET.tenang, d.pengaturan.tenang||{});
  d.pengaturan.alokasi = Object.assign(DEF_SET.alokasi, d.pengaturan.alokasi||{});
  d.notifikasi = d.notifikasi || [];
  return d;
}
// simpan ke localStorage perangkat (selalu — cadangan utama)
function persist(){ L('sf_d', S.d); }

// kirim/baca ke Google Sheets via Apps Script (best-effort; diam kalau gagal)
async function apiRaw(action, body){
  try{
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:L('sf_tok')||'', ...body})});
    return JSON.parse(await r.text());
  }catch(e){ return null; }
}
async function apiSync(action, body){
  try{
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:L('sf_tok')||'', ...body})});
    const j = JSON.parse(await r.text());
    if(j && j.needLogin){ if(window._syncTimer){ clearInterval(window._syncTimer); window._syncTimer=null; } showLogin('Sesi berakhir — masuk lagi'); return null; }
    return (j && j.ok) ? j : null;
  }catch(e){ return null; }
}
// Antrian perubahan belum terkirim (local-first: data aman walau offline).
// Setiap mutasi langsung diterapkan ke lokal + masuk antrian, lalu dicoba
// dikirim. Bila gagal tetap di antrian & dikirim ulang saat online. pull()
// tidak jalan selama antrian masih ada isi — agar data lokal yang belum
// terkirim tidak ditimpa & hilang.
function persistQ(){ L('sf_q', S.q); }
function pushQ(op){ S.q.push(op); persistQ(); flush(); }
let _flushing=false;
async function flush(){
  if(_flushing || !navigator.onLine || !S.q.length) return;
  _flushing=true;
  try{
    const batch = S.q.slice(0, 25);
    const j = await apiSync('sync', {ops: batch});
    if(j){ S.q = S.q.slice(batch.length); persistQ(); }   // terkirim → buang dari antrian
  }catch(e){}
  _flushing=false;
}
async function pull(){
  if(S.q.length || !navigator.onLine) return;             // ada perubahan belum terkirim → jangan tarik (anti data-hilang)
  const j = await apiSync('data', {});
  const d = j && j.d;
  // hanya timpa lokal bila Sheets punya data nyata (lokal masih kosong/baru → terima data Sheets)
  if(d && ((d.transaksi||[]).length || (d.rekening||[]).length || (d.tagihan||[]).length || (d.target||[]).length)){
    S.d = normalizeD(d); L('sf_d', S.d); renderAll();
  }
}
function syncNow(){ flush(); pull(); }

// ===== LOGIN, LOGOUT & GANTI SANDI =====
function showLogin(msg, retry){
  const v=$('loginView'); if(!v) return;
  $('splash').style.display='none';
  $('app').hidden=true; S.d=null;   // jangan tampilkan data apa pun di layar login
  if(window._syncTimer){ clearInterval(window._syncTimer); window._syncTimer=null; }
  v.style.display='flex';
  const first = S._hasPwd===false;  // sandi server belum ada → mode atur sandi
  $('_lgCWrap').style.display = first?'block':'none';
  const b=$('_lgBtn');
  b.textContent = retry?'Coba lagi':(first?'Atur sandi & mulai':'Masuk');
  b.onclick = retry?()=>boot():doLogin;
  const e=$('_lgErr');
  e.textContent=msg||''; e.style.display=msg?'block':'none';
  setTimeout(()=>{ try{ $('_lgPwd').focus(); }catch(err){} }, 120);
}
async function doLogin(){
  const pw=$('_lgPwd').value, first = S._hasPwd===false;
  const err=m=>{ const e=$('_lgErr'); e.textContent=m; e.style.display='block'; };
  if(!pw){ err('Isi sandi dulu'); return; }
  if(pw.length<4){ err('Sandi minimal 4 karakter'); return; }
  if(first && pw!==$('_lgC').value){ err('Konfirmasi sandi tidak sama'); return; }
  const b=$('_lgBtn'); b.disabled=true; b.textContent='Memproses…';
  const j=await apiRaw('login', {password:pw});
  b.disabled=false;
  if(!j){ err('Server tidak terjangkau — coba lagi'); return; }
  if(!j.ok){ err(j.err||j.error||'Sandi salah'); return; }
  L('sf_tok', j.token);
  S._hasPwd=true;
  $('_lgPwd').value=''; $('_lgC').value='';
  enterApp();
}
async function doLogout(){
  if(!confirm('Keluar? Data pada perangkat ini akan dihapus.')) return;
  try{ await apiRaw('logout', {}); }catch(e){}
  ['sf_tok','sf_d','sf_q'].forEach(k=>localStorage.removeItem(k));
  S.q=[]; S.d=null;
  location.reload();
}
function openGantiSandi(){
  openSheet('Ganti sandi', `
    <div class="hint">Sesi di semua perangkat dicabut setelah sandi diganti — perangkat lain wajib masuk lagi.</div>
    <div class="fld"><label>Sandi lama</label><input id="_pwOld" type="password" autocomplete="current-password"></div>
    <div class="fld"><label>Sandi baru (min. 4 karakter)</label><input id="_pwNew" type="password" autocomplete="new-password"></div>
    <div class="fld"><label>Ulangi sandi baru</label><input id="_pwNew2" type="password" autocomplete="new-password"></div>
    <div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveGantiSandi()">Simpan</button></div>`);
}
async function saveGantiSandi(){
  const o=$('_pwOld').value, n=$('_pwNew').value, n2=$('_pwNew2').value;
  if(n.length<4){ toast('Sandi baru minimal 4 karakter',1); return; }
  if(n!==n2){ toast('Ulangi sandi tidak sama',1); return; }
  toast('Memproses…');
  const j=await apiRaw('changePassword', {oldPassword:o, newPassword:n});
  if(!j){ toast('Server tidak terjangkau',2); return; }
  if(!j.ok){ toast(j.err||j.error||'Gagal ganti sandi',1); return; }
  const li=await apiRaw('login', {password:n});  // token lama dicabut → buat sesi baru
  if(li && li.ok) L('sf_tok', li.token);
  closeSheet(); toast('Sandi diganti — perangkat lain perlu masuk lagi');
}

/* ===================== LOAD / BOOT ===================== */
// deteksi sisa data contoh versi lama yang belum pernah diedit pengguna → perlakukan sebagai kosong
function isDemoSeed(d){ return !!(d && !d.ver && Array.isArray(d.rekening) && d.rekening.some(r=>r.id==='r1'&&r.nama==='BCA') && (d.utang||[]).some(u=>u.id==='u1'&&u.nama==='Kartu kredit BCA') && (d.danaDarurat||[]).some(x=>x.id==='dd1'&&x.jumlah_bulanan===2000000)); }
async function boot(){
  S.q = L('sf_q') || [];            // muat antrian perubahan belum terkirim
  setTimeout(()=>{ $('splash').style.display='none'; }, 400);
  // data TIDAK dimuat sebelum login — siapa pun yang membuka link tanpa sandi
  // hanya melihat layar masuk, tidak pernah melihat data.
  const st = await apiRaw('status', {});
  if(!st || !st.ok){ showLogin('Server tidak terjangkau. Periksa internet lalu coba lagi.', true); return; }
  S._hasPwd = !!st.hasPassword;     // sandi belum ada di server → mode atur sandi pertama
  if(!L('sf_tok')){ showLogin(); return; }
  enterApp();
}
function enterApp(){
  let ld = L('sf_d');
  if(isDemoSeed(ld)) ld = null;     // data contoh lama → mulai bersih (data asli tetap bisa ditarik dari Sheets)
  S.d = normalizeD(ld || KOSONG);
  $('loginView').style.display='none';
  $('app').hidden=false;
  afterData();
  syncNow();                        // kirim antrian + tarik data terbaru dari Sheets
  if(!window._syncTimer){ window._syncTimer=setInterval(syncNow, 60000); addEventListener('online', syncNow); } // sinkron berkala (lintas perangkat)
}
function afterData(){
  buildNav();
  go(S.tab||'dash');
  recomputeAll();
}

/* ===================== MUTASI DATA (tambah/edit/hapus) ===================== */
function mutate(tipe, op, row){
  if(tipe==='pengaturan'){
    S.d.pengaturan = row;
  } else {
    const arr = S.d[tipe] || (S.d[tipe]=[]);
    if(op==='add'){ arr.unshift(row); }
    else if(op==='upd'){ const i=arr.findIndex(x=>x.id===row.id); if(i>=0) arr[i]=row; }
    else if(op==='del'){ const i=arr.findIndex(x=>x.id===row.id); if(i>=0) arr.splice(i,1); }
  }
  persist();
  pushQ({t:tipe, op, id:row&&row.id, row});
  recomputeAll();
}
// simpan pengaturan
function savePengaturan(){
  persist();
  pushQ({t:'pengaturan', op:'set', row:S.d.pengaturan});
  recomputeAll();
}
function recomputeAll(){
  generateNotifications();
  renderAll();
}

/* ===================== SMART LOGIC ===================== */
const KAT = id => (D().kategori.find(k=>k.id===id) || {nama:'?',ikon:'•',warna:'#8a98ab'});
const REK = id => (D().rekening.find(r=>r.id===id) || {nama:'?'});

// saldo rekening = saldo_awal + pemasukan - pengeluaran (transf antar rekening netral)
function saldoRekening(rid){
  const r = REK(rid); if(!r) return 0;
  let s = +r.saldo_awal||0;
  D().transaksi.forEach(t=>{
    if(t.tipe==='in' && t.rekening_id===rid) s += +t.jumlah;
    if(t.tipe==='out' && t.rekening_id===rid) s -= +t.jumlah;
    if(t.tipe==='transfer'){
      if(t.rekening_id===rid) s -= +t.jumlah;
      if(t.ke_rekening_id===rid) s += +t.jumlah;
    }
  });
  return s;
}
function totalSaldo(){ return D().rekening.reduce((a,r)=>a+saldoRekening(r.id),0); }

// transaksi bulan tertentu
function trxByMonth(mk){
  return D().transaksi.filter(t=>String(t.tgl).slice(0,7)===mk);
}
function sumIn(trxs){ return trxs.filter(t=>t.tipe==='in').reduce((a,t)=>a+(+t.jumlah||0),0); }
function sumOut(trxs){ return trxs.filter(t=>t.tipe==='out').reduce((a,t)=>a+(+t.jumlah||0),0); }

// ===== 1) DANA DARURAT & REKOMENDASI =====
// biaya hidup POKOK: baris bernama "cicilan/utang/angsuran" diabaikan di sini
// karena cicilan riil diambil otomatis dari daftar Utang (anti dobel hitung).
function biayaHidupPokok(){ return D().danaDarurat.reduce((a,x)=>a+((/cicilan|utang|angsuran/i.test(x.kategori_kebutuhan||''))?0:(+x.jumlah_bulanan||0)),0); }
// total cicilan per bulan dari seluruh utang aktif
function cicilanBulanan(){ return debtsActive().reduce((a,u)=>a+(+u.cicilan||0),0); }
// beban bulanan wajib = biaya hidup pokok + cicilan
function bebanBulanan(){ return biayaHidupPokok()+cicilanBulanan(); }
// alias lama (kompatibilitas)
function biayaHidupBulanan(){ return biayaHidupPokok(); }
// penghasilan: prioritas nilai di Pengaturan; bila kosong → estimasi rata-rata
// pemasukan 3 bulan terakhir; selalu menghasilkan angka (tidak pernah kosong).
function penghasilanInfo(){
  const set=+D().pengaturan.penghasilanBulanan||0;
  if(set>0) return {v:set, src:'pengaturan'};
  let sum=0,cnt=0;
  for(let i=0;i<3;i++){ const d=new Date(); d.setMonth(d.getMonth()-i); const sv=sumIn(trxByMonth(d.toISOString().slice(0,7))); if(sv>0){sum+=sv;cnt++;} }
  if(cnt) return {v:Math.round(sum/cnt), src:'estimasi'};
  return {v:0, src:'belum-diatur'};
}
// rasio cicilan terhadap penghasilan (%). null bila penghasilan belum diatur.
function rasioCicilan(){ const inc=penghasilanInfo().v; const c=cicilanBulanan(); return inc>0 ? c/inc*100 : null; }
function rasioCicilanStatus(){ const r=rasioCicilan(); if(r==null) return {cls:'',l:'Atur penghasilan'}; if(r<=30) return {cls:'g',l:'Aman'}; if(r<=40) return {cls:'a',l:'Waspada'}; return {cls:'r',l:'Tinggi'}; }
// REKOMENDASI DANA DARURAT:
//   target ideal = 6 × (biaya hidup pokok + cicilan/bulan), minimum 3 ×.
//   Setoran disarankan = kekurangan ÷ 12 bulan, dibatasi maks 25% penghasilan
//   dan maks kapasitas menabung (penghasilan − beban). ETA dihitung ulang.
function rekomDanaDarurat(){
  const ef=calcEmergency();
  const inc=penghasilanInfo();
  const sisaIdeal=Math.max(0, ef.ideal-ef.dana);
  const sisaMin=Math.max(0, ef.min-ef.dana);
  const kapasitas=inc.v>0 ? inc.v-bebanBulanan() : 0;
  const per12=sisaIdeal>0 ? Math.ceil(sisaIdeal/12/50000)*50000 : 0;
  const cap=inc.v>0 ? Math.floor(inc.v*0.25/50000)*50000 : 0;
  const kapCap=kapasitas>0 ? Math.floor(kapasitas/50000)*50000 : 0;
  let saran=per12, terbatas=false;
  if(cap>0 && per12>cap){ saran=cap; terbatas=true; }
  if(kapCap>0 && saran>kapCap){ saran=kapCap; terbatas=true; }
  if(inc.v>0 && kapasitas<=0 && sisaIdeal>0){ saran=0; terbatas=true; }
  if(saran<=0 && sisaIdeal>0 && inc.v<=0) saran=500000;
  const etaBulan=saran>0?Math.ceil(sisaIdeal/saran):null;
  let etaTgl=null;
  if(etaBulan!=null){ const d=new Date(); d.setMonth(d.getMonth()+etaBulan); etaTgl=MONTHS[d.getMonth()]+' '+d.getFullYear(); }
  return {ef,inc,sisaIdeal,sisaMin,kapasitas,per12,saran,terbatas,etaBulan,etaTgl};
}
// apakah pengguna sudah mengisi data apa pun (pembeda tampilan kosong vs terisi)
function hasData(){ const d=D(); return bebanBulanan()>0 || penghasilanInfo().v>0 || (d.transaksi||[]).length>0 || (d.utang||[]).length>0 || (d.tagihan||[]).length>0 || (d.target||[]).length>0 || danaDaruratSaldo()>0; }
function danaDaruratSaldo(){
  // prioritas: rekening yang ditandai; jika tidak ada, ambil rekening bernama mengandung "darurat"; else 0
  const set = D().pengaturan;
  if(set.danaDaruratRekening) return saldoRekening(set.danaDaruratRekening);
  const r = D().rekening.find(x=>/darurat|emergency/i.test(x.nama));
  return r ? saldoRekening(r.id) : 0;
}
function calcEmergency(){
  const biaya=biayaHidupPokok(), cicilan=cicilanBulanan(), beban=bebanBulanan();
  const dana=danaDaruratSaldo();
  const rasio=beban>0?dana/beban:0;
  const min=beban*3, ideal=beban*6, max=beban*12;
  let status, cls, emoji;
  if(rasio<1){ status='Kritis'; cls='r'; emoji='🆘'; }
  else if(rasio<3){ status='Belum Aman'; cls='a'; emoji='⚠️'; }
  else if(rasio<6){ status='Cukup'; cls='a'; emoji='🛡️'; }
  else { status='Aman'; cls='g'; emoji='✅'; }
  const pctMin = min>0 ? Math.min(100, Math.round(dana/min*100)) : 0;
  const pctIdeal = ideal>0 ? Math.round(dana/ideal*100) : 0;
  const sisaMin = Math.max(0, min-dana);
  const sisaIdeal = Math.max(0, ideal-dana);
  const bulanTahan = beban>0 ? dana/beban : 0;
  return {biaya,cicilan,beban,dana,rasio,min,ideal,max,status,cls,emoji,pctMin,pctIdeal,sisaMin,sisaIdeal,bulanTahan};
}

// ===== 2) ANGGARAN / KONTROL PENGELUARAN =====
function budgetFor(katId, mk){
  return D().anggaran.find(a=>a.kategori_id===katId && a.bulan===mk);
}
function spentByKat(katId, mk){
  return trxByMonth(mk).filter(t=>t.tipe==='out' && t.kategori_id===katId).reduce((a,t)=>a+(+t.jumlah||0),0);
}
function budgetRows(mk){
  return D().anggaran.filter(a=>a.bulan===mk).map(a=>{
    const k=KAT(a.kategori_id); const spent=spentByKat(a.kategori_id,mk);
    const pct = a.batas>0 ? spent/a.batas*100 : 0;
    let st='aman', cls='g';
    if(pct>=100){ st='terlampaui'; cls='r'; }
    else if(pct>=80){ st='hampir habis'; cls='a'; }
    return {...a, kategori:k.nama, ikon:k.ikon, warna:k.warna, spent, pct, sisa:a.batas-spent, st, cls};
  });
}

// ===== 3) TAGIHAN & UTANG jatuh tempo =====
function billsUpcoming(){
  const now=new Date(); now.setHours(0,0,0,0);
  return D().tagihan.filter(b=>b.status!=='lunas').map(b=>{
    let d=new Date(b.jatuh_tempo); if(isNaN(d)) return null;
    // jika sudah lewat bulan ini, geser ke bulan depan sesuai frekuensi (untuk pengingat berulang)
    d.setHours(0,0,0,0);
    const dd=daysUntil(b.jatuh_tempo);
    return {...b, hari:dd};
  }).filter(Boolean).sort((a,b)=>a.hari-b.hari);
}
function debtsActive(){ return D().utang.filter(u=>+u.sisa>0); }

// ===== 4) PREDIKSI CASHFLOW =====
function nextIncomeDate(){
  // perkiraan gajian berikutnya: cari transaksi 'Gaji' bulan lalu, ambil tanggalnya untuk bulan depan
  const gaji = D().transaksi.filter(t=>t.tipe==='in' && KAT(t.kategori_id).nama==='Gaji').sort((a,b)=>a.tgl<b.tgl?-1:1);
  if(gaji.length){
    const last=gaji[gaji.length-1]; const d=new Date(last.tgl); const next=new Date();
    next.setDate(d.getDate()); if(next<new Date()) next.setMonth(next.getMonth()+1);
    return next;
  }
  // default: tanggal 1 bulan depan
  const n=new Date(); n.setMonth(n.getMonth()+1); n.setDate(1); return n;
}
function predictCashflow(){
  const saldo = totalSaldo();
  const nextIn = nextIncomeDate();
  const daysLeft = Math.max(0, daysUntil(nextIn.toISOString().slice(0,10)));
  // tagihan jatuh tempo sebelum gajian berikutnya
  const billsBefore = billsUpcoming().filter(b=>b.hari>=0 && b.hari<=daysLeft);
  const cicilanBefore = debtsActive().filter(u=>{ const dd=daysUntil(u.jatuh_tempo); return dd>=0 && dd<=daysLeft; });
  const totalBills = billsBefore.reduce((a,b)=>a+(+b.jumlah||0),0);
  const totalCicilan = cicilanBefore.reduce((a,u)=>a+(+u.cicilan||0),0);
  // perkiraan pengeluaran harian (rata-rata 30 hari terakhir)
  const lately = D().transaksi.filter(t=>t.tipe==='out' && daysUntil(t.tgl)>=-30 && daysUntil(t.tgl)<=0).reduce((a,t)=>a+(+t.jumlah||0),0);
  const dailyAvg = lately/30;
  const projSpend = dailyAvg*daysLeft;
  const projSaldo = saldo - totalBills - totalCicilan - projSpend;
  const incomeEst = penghasilanInfo().v;
  let risk='aman', cls='g', emoji='✅';
  if(projSaldo<0){ risk='Kritis'; cls='r'; emoji='🆘'; }
  else if(projSaldo < dailyAvg*3){ risk='Berisiko'; cls='a'; emoji='⚠️'; }
  return {saldo,daysLeft,nextIn,billsBefore,cicilanBefore,totalBills,totalCicilan,dailyAvg,projSpend,projSaldo,incomeEst,risk,cls,emoji};
}

// ===== 5) TARGET =====
function goalProgress(g){
  const pct = g.target_jumlah>0 ? Math.min(100, Math.round(g.terkumpul/g.target_jumlah*100)) : 0;
  const sisa = Math.max(0, g.target_jumlah-g.terkumpul);
  const now=new Date();
  // berapa bulan lagi sampai target tanggal
  const td=new Date(g.target_tanggal); if(isNaN(td)) return {...g,pct,sisa,etaBulan:null,st:'—',cls:'g'};
  const blnLeft = Math.max(0, Math.round((td-now)/(30*86400000)));
  // setoran ideal per bulan untuk capai tepat waktu
  const ideal = blnLeft>0 ? sisa/blnLeft : sisa;
  const setoran = +g.setoran_bulanan||0;
  let st='on track', cls='g';
  if(setoran < ideal*0.8 && blnLeft>0){ st='tertinggal'; cls='a'; }
  if(blnLeft<=0 && sisa>0){ st='terlewat'; cls='r'; }
  // eta berdasarkan setoran aktual
  let etaBulan = setoran>0 ? Math.ceil(sisa/setoran) : null;
  if(etaBulan!==null && sisa<=0) etaBulan=0;
  return {...g,pct,sisa,blnLeft,ideal,setoran,etaBulan,st,cls};
}

// ===== 6) SKOR KESEHATAN KEUANGAN (0-100) =====
function calcHealth(){
  const ef = calcEmergency();
  const cf = predictCashflow();
  const mk=monthKey(); const br=budgetRows(mk);
  const set = D().pengaturan;

  // (30) dana darurat: capai 6 bulan = 100%
  const sEF = Math.min(100, ef.rasio/6*100);
  // (25) cashflow: proyeksi saldo >= penghasilan 1 bulan = 100; <0 = 0
  const cfRef = Math.max(1, penghasilanInfo().v||bebanBulanan());
  const sCF = Math.max(0, Math.min(100, cf.projSaldo/cfRef*100));
  // (20) kontrol pengeluaran: rata2 pct anggaran terpakai (lebih rendah = lebih baik)
  let sBG = 100;
  if(br.length){ const avg=br.reduce((a,b)=>a+Math.min(120,b.pct),0)/br.length; sBG = Math.max(0, 100 - Math.max(0,avg-70)*1.6); }
  // (15) beban utang: rasio cicilan/bulan vs penghasilan
  const cicilanB = cicilanBulanan();
  const income = penghasilanInfo().v;
  const debtRatio = income>0 ? cicilanB/income : 0;
  const sDB = Math.max(0, 100 - debtRatio*200); // 50% beban = 0
  // (10) konsistensi menabung: ada setoran dana darurat/target 3 bulan terakhir
  const ddRekId = set.danaDaruratRekening || (D().rekening.find(x=>/darurat|emergency/i.test(x.nama))||{}).id;
  const in90 = t => { const dd=daysUntil(t.tgl); return dd>=-90 && dd<=0; };
  const tabungan3 = D().transaksi.filter(t=>{
    if(t.tipe==='out' && /tabungan|darurat/i.test(KAT(t.kategori_id).nama) && in90(t)) return true;
    if(t.tipe==='transfer' && t.ke_rekening_id===ddRekId && in90(t)) return true;
    return false;
  }).length;
  const sSV = Math.min(100, tabungan3/3*100);

  const total = Math.round(sEF*0.30 + sCF*0.25 + sBG*0.20 + sDB*0.15 + sSV*0.10);
  let status, cls;
  if(total<40){ status='Berisiko'; cls='r'; }
  else if(total<60){ status='Perlu Perbaikan'; cls='a'; }
  else if(total<80){ status='Cukup Sehat'; cls='a'; }
  else { status='Sehat'; cls='g'; }
  return {total,status,cls,parts:[
    {n:'Kecukupan dana darurat',w:30,s:Math.round(sEF)},
    {n:'Stabilitas cashflow',w:25,s:Math.round(sCF)},
    {n:'Kontrol pengeluaran',w:20,s:Math.round(sBG)},
    {n:'Beban utang',w:15,s:Math.round(sDB)},
    {n:'Konsistensi menabung',w:10,s:Math.round(sSV)}
  ], cicilanBulanan:cicilanB, debtRatio};
}

// ===== 7) ALOKASI GAJI (adaptif) =====
function recommendAllocation(){
  const set=D().pengaturan; const base=set.alokasi;
  const h=calcHealth();
  // bila beban utang tinggi, geser dari hiburan+bebas ke tabungan
  let a={...base};
  if(h.debtRatio>0.3){
    const shift=Math.min(10, Math.round((h.debtRatio-0.3)*100));
    a.hiburan=Math.max(5,a.hiburan-shift);
    a.bebas=Math.max(0,a.bebas-Math.floor(shift/2));
    a.tabungan=Math.min(40,a.tabungan+shift+Math.ceil(shift/2));
  }
  // bila dana darurat belum aman, tambah tabungan
  const ef=calcEmergency();
  if(ef.rasio<3){
    const shift=Math.min(8, Math.round((3-ef.rasio)*2));
    a.hiburan=Math.max(5,a.hiburan-shift);
    a.tabungan=Math.min(45,a.tabungan+shift);
  }
  return a;
}

// ===== 8) DETEKSI PENGELUARAN ABNORMAL =====
function abnormalSpending(){
  const mk=monthKey();
  const out=[];
  D().kategori.filter(k=>k.tipe==='out').forEach(k=>{
    // rata-rata 3 bulan terakhir
    let sum=0,cnt=0;
    for(let i=1;i<=3;i++){ const d=new Date(); d.setMonth(d.getMonth()-i); const mk2=d.toISOString().slice(0,7); const s=spentByKat(k.id,mk2); if(s>0){sum+=s;cnt++;} }
    const avg = cnt>0?sum/cnt:0;
    const cur = spentByKat(k.id,mk);
    if(avg>0 && cur>avg*1.3){
      const pct=Math.round((cur-avg)/avg*100);
      out.push({kategori:k,pct,avg,cur});
    }
  });
  return out.sort((a,b)=>b.pct-a.pct);
}

// ===== 9) GENERATOR NOTIFIKASI PINTAR =====
function dedupKey(tipe, kunci){ return tipe+'|'+(kunci||''); }
function inQuietHours(){
  const q=D().pengaturan.tenang; if(!q.on) return false;
  const now=new Date(); const hm=now.getHours()*60+now.getMinutes();
  const [h1,m1]=q.mulai.split(':').map(Number); const [h2,m2]=q.selesai.split(':').map(Number);
  const s1=h1*60+m1, s2=h2*60+m2;
  if(s1<s2) return hm>=s1 && hm<s2;
  return hm>=s1 || hm<s2; // melewati tengah malam
}
function addNotif(n){
  // n: {tipe,kunci,prioritas(crit/hi/mid/lo),emoji,judul,pesan,aksi}
  const set=D().pengaturan.notif||{};
  const map={danaDarurat:'danaDarurat',anggaran:'anggaran',tagihan:'tagihan',cashflow:'cashflow',target:'target',langganan:'langganan',abnormal:'abnormal',tidakCatat:'tidakCatat',evaluasi:'evaluasi',gaji:'gaji',utang:'utang'};
  const key=map[n.tipe];
  if(key && !set[key]) return; // dimatikan pengguna
  const dk=dedupKey(n.tipe,n.kunci);
  const arr=D().notifikasi;
  // cek apakah sudah ada notifikasi aktif (belum ditangani) dengan kunci sama dalam 24 jam
  const exists = arr.find(x=>x.kunci===dk && x.status!=='handled' && (Date.now()-new Date(x.timestamp).getTime())<86400000);
  if(exists){ // update pesan jika lebih parah, jangan buat duplikat
    if(n.prioritas==='crit' && exists.prioritas!=='crit'){ exists.prioritas='crit'; exists.pesan=n.pesan; }
    return;
  }
  const notif={ id:uid2(), timestamp:new Date().toISOString(), kunci:dk, status:'new', snoozeUntil:null, ...n };
  arr.unshift(notif);
  // batasi 100 notif
  if(arr.length>100) arr.length=100;
}
function generateNotifications(){
  if(!D()) return;
  const arr=D().notifikasi||[];
  // tandai notifikasi event yang sudah tidak relevan sebagai handled? tidak—biarkan pengguna kelola.
  // hanya generate yang baru:
  // 1) dana darurat
  const ef=calcEmergency();
  if(ef.beban>0&&ef.rasio<3){
    const rk=rekomDanaDarurat();
    addNotif({tipe:'danaDarurat',kunci:'ef',prioritas: ef.rasio<1?'crit':'hi',
      emoji:'🛡️',judul:'Dana darurat belum aman',
      pesan:`Dana darurat ${R(ef.dana)} = ${ef.bulanTahan.toFixed(1)} bulan beban (biaya hidup + cicilan ${R(ef.beban)}/bln). Target ideal ${R(ef.ideal)}. Sisihkan ${R(rk.saran>0?rk.saran:500000)}/bln agar ideal tercapai ±${rk.etaBulan!=null?rk.etaBulan:'…'} bulan.`,
      aksi:[{l:'Lihat rekomendasi',t:'go',v:'dash'}]});
  }
  const rc=rasioCicilan();
  if(rc!=null && rc>30){ addNotif({tipe:'utang',kunci:'dsr',prioritas:rc>40?'crit':'hi',emoji:'💳',judul:'Beban cicilan tinggi',
    pesan:`Cicilan ${R(cicilanBulanan())}/bln = ${Math.round(rc)}% penghasilan (batas aman umum 30%). Prioritaskan lunasi utang bunga tertinggi & tunda utang baru.`,
    aksi:[{l:'Lihat utang',t:'go',v:'tagihan'}]}); }
  // 2) anggaran
  budgetRows(monthKey()).forEach(b=>{
    if(b.pct>=100){ addNotif({tipe:'anggaran',kunci:'bg-'+b.kategori_id,prioritas:'hi',emoji:'🚨',judul:'Anggaran '+b.kategori+' terlampaui',pesan:`Pengeluaran ${b.kategori} sudah ${Math.round(b.pct)}% dari anggaran ${R(b.batas)} bulan ini, melebihi batas ${R(b.spent-b.batas)}.`,aksi:[{l:'Lihat anggaran',t:'go',v:'anggaran'}]}); }
    else if(b.pct>=80){ const sisaHari=daysInMonthLeft(); addNotif({tipe:'anggaran',kunci:'bg-'+b.kategori_id,prioritas:'mid',emoji:'⚠️',judul:'Anggaran '+b.kategori+' hampir habis',pesan:`Pengeluaran ${b.kategori} sudah ${Math.round(b.pct)}% dari anggaran bulan ini, padahal masih ada ${sisaHari} hari tersisa.`,aksi:[{l:'Lihat anggaran',t:'go',v:'anggaran'}]}); }
  });
  // 3) tagihan H-7,H-3,H-1, jatuh tempo
  billsUpcoming().forEach(b=>{
    const d=b.hari;
    if(d<=0){ addNotif({tipe:'tagihan',kunci:'bl-'+b.id,prioritas:'crit',emoji:'📅',judul:'Tagihan jatuh tempo hari ini',pesan:`${b.nama} ${R(b.jumlah)} jatuh tempo hari ini. Pastikan saldo mencukupi.`,aksi:[{l:'Tandai lunas',t:'paybill',v:b.id}]}); }
    else if(d===1||d===3||d===7){ addNotif({tipe:'tagihan',kunci:'bl-'+b.id+'-'+d,prioritas:d<=1?'crit':'hi',emoji:'📅',judul:'Tagihan mendekati jatuh tempo',pesan:`${b.nama} ${R(b.jumlah)} jatuh tempo dalam ${d} hari (${fmtDate(b.jatuh_tempo)}). Pastikan saldo mencukupi.`,aksi:[{l:'Lihat tagihan',t:'go',v:'tagihan'}]}); }
  });
  // 4) utang jatuh tempo
  debtsActive().forEach(u=>{ const d=daysUntil(u.jatuh_tempo);
    if(d>=0&&d<=3){ addNotif({tipe:'utang',kunci:'ut-'+u.id+'-'+d,prioritas:d<=1?'crit':'hi',emoji:'💳',judul:'Cicilan jatuh tempo',pesan:`${u.nama}: cicilan ${R(u.cicilan)} jatuh tempo ${d===0?'hari ini':'dalam '+d+' hari'}. Sisa utang ${R(u.sisa)}.`,aksi:[{l:'Lihat utang',t:'go',v:'tagihan'}]}); }
  });
  // 5) cashflow berisiko
  const cf=predictCashflow();
  if(cf.risk!=='aman'){
    addNotif({tipe:'cashflow',kunci:'cf',prioritas:cf.risk==='Kritis'?'crit':'hi',emoji:cf.emoji,judul:'Cashflow Anda berisiko!',
      pesan:`Saldo saat ini ${R(cf.saldo)}. Terdapat tagihan & cicilan ${R(cf.totalBills+cf.totalCicilan)} sebelum pemasukan berikutnya (${cf.daysLeft} hari lagi). Saldo diperkirakan ${R(cf.projSaldo)} sampai gajian.`,
      aksi:[{l:'Lihat detail',t:'go',v:'keamanan'}]});
  }
  // 6) target tertinggal
  D().target.forEach(g=>{ const p=goalProgress(g);
    if(p.st==='tertinggal'){ addNotif({tipe:'target',kunci:'tg-'+g.id,prioritas:'mid',emoji:'🎯',judul:'Target "'+g.nama+'" tertinggal',pesan:`Target ${g.nama} baru ${p.pct}%. Untuk capai tepat waktu perlu setoran ${R(Math.round(p.ideal))}/bln, saat ini ${R(p.setoran)}/bln.`,aksi:[{l:'Lihat target',t:'go',v:'target'}]}); }
    else if(p.st==='terlewat'){ addNotif({tipe:'target',kunci:'tg-'+g.id,prioritas:'hi',emoji:'🎯',judul:'Target "'+g.nama+'" melebihi tenggat',pesan:`Target ${g.nama} seharusnya tercapai sudah. Progress ${p.pct}%, masih kurang ${R(p.sisa)}.`}); }
    else if(p.pct>=72 && p.pct<100){ addNotif({tipe:'target',kunci:'tg-'+g.id+'-72',prioritas:'lo',emoji:'🎯',judul:'Target "'+g.nama+'" hampir tercapai',pesan:`Target ${g.nama} sudah ${p.pct}%. Dengan setoran saat ini, diperkirakan tercapai dalam ${p.etaBulan} bulan.`}); }
  });
  // 7) abnormal
  abnormalSpending().slice(0,2).forEach(a=>{ addNotif({tipe:'abnormal',kunci:'ab-'+a.kategori.id,prioritas:'mid',emoji:'📈',judul:'Pengeluaran '+a.kategori.nama+' meningkat',pesan:`Pengeluaran ${a.kategori.nama} bulan ini ${R(a.cur)}, ${a.pct}% di atas rata-rata 3 bulan terakhir (${R(a.avg)}).`}); });
  // 8) gaji masuk (jika ada pemasukan >50% penghasilan bulan ini dan alokasi belum diatur)
  const mk=monthKey(); const gajiMasuk=trxByMonth(mk).filter(t=>t.tipe==='in' && KAT(t.kategori_id).nama==='Gaji');
  if(gajiMasuk.length && !D()._alokasiDone){ addNotif({tipe:'gaji',kunci:'gaji-'+mk,prioritas:'lo',emoji:'💰',judul:'Gaji sudah masuk',pesan:`Pemasukan tercatat ${R(gajiMasuk.reduce((a,t)=>a+(+t.jumlah||0),0))}. Gunakan rekomendasi alokasi untuk membagi gaji Anda.`,aksi:[{l:'Lihat alokasi',t:'go',v:'keamanan'}]}); }
  // 9) tidak ada pencatatan (jika 3 hari tidak ada transaksi)
  const lastTrx=D().transaksi.filter(t=>t.tipe).sort((a,b)=>a.tgl<b.tgl?1:-1)[0];
  if(lastTrx){ const dd=daysUntil(lastTrx.tgl); if(dd<-3){ addNotif({tipe:'tidakCatat',kunci:'nc',prioritas:'lo',emoji:'📝',judul:'Sudah '+(-dd)+' hari tidak mencatat',pesan:'Catat transaksi terakhir Anda agar laporan tetap akurat.'}); } }

  persist();
}

}

/* ===================== CHARTS (inline SVG) ===================== */
function donut(segs, size=150, thick=24){
  const total=segs.reduce((a,s)=>a+(+s.val||0),0); const T=total||1;
  const r=(size-thick)/2, c=2*Math.PI*r, cx=size/2; let off=0, parts='';
  segs.forEach(s=>{ const f=(+s.val||0)/T; if(f<=0)return; const len=f*c;
    parts+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`; off+=len; });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#eef2f7" stroke-width="${thick}"/>${parts}</svg>`;
}
function ringSVG(pct, color, size=130, thick=14){
  const r=(size-thick)/2, c=2*Math.PI*r, cx=size/2, len=Math.max(0,Math.min(100,pct))/100*c;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#eef2f7" stroke-width="${thick}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="0" transform="rotate(-90 ${cx} ${cx})"/></svg>`;
}
function lineChart(series, w=320, h=140){
  // series:[{label,val}]; max scaling
  const vals=series.map(s=>+s.val||0); const max=Math.max(1,...vals), min=Math.min(0,...vals);
  const pad=24, pw=w-pad*2, ph=h-pad-14;
  const pts=series.map((s,i)=>{ const x=pad+(series.length>1?i/(series.length-1)*pw:pw/2); const y=pad+ph-((s.val-min)/(max-min||1)*ph); return {x,y,...s}; });
  const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const bars=pts.map(p=>`<rect x="${(p.x-9).toFixed(1)}" y="${p.y.toFixed(1)}" width="18" height="${(pad+ph-p.y).toFixed(1)}" rx="3" fill="${p.val<0?'#fdeaea':'#e7f7ee'}"/><rect x="${(p.x-9).toFixed(1)}" y="${p.y.toFixed(1)}" width="18" height="6" rx="2" fill="${p.val<0?'#d93b3b':'#0f9d6b'}"/>`).join('');
  const labs=series.map((s,i)=> i%Math.ceil(series.length/6)===0?`<text x="${pad+(series.length>1?i/(series.length-1)*pw:pw/2)}" y="${h-3}" font-size="10" fill="#8a98ab" text-anchor="middle">${s.label}</text>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${bars}<path d="${path}" fill="none" stroke="#0f9d6b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${labs}</svg>`;
}

function monthOptions(){
  const opts=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); opts.push({v:d.toISOString().slice(0,7), l:MONTHS_L[d.getMonth()]+' '+d.getFullYear()}); }
  return opts;
}

    <button class="${tab==='new'?'on':''}" onclick="_notifTab='new';renderNotifikasi()">Aktif (${all.filter(n=>n.status==='new').length})</button>

    <button class="${tab==='all'?'on':''}" onclick="_notifTab='all';renderNotifikasi()">Semua</button>
  </div>
  ${inQuietHours()?'<div class="banner b"><span class="em">🌙</span><div>Mode jam tenang aktif — notifikasi baru tetap dibuat namun tidak mengganggu.</div></div>':''}
  ${list.length?list.map(n=>`<div class="notif ${n.prioritas} ${n.status==='handled'?'read':''}">
      <div class="em">${n.emoji||'🔔'}</div><div class="bd"><div class="t">${E(n.judul)}</div><div class="m">${E(n.pesan)}</div>
      <div class="mt"><span>${new Date(n.timestamp).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><span class="chip ${n.prioritas==='crit'?'r':n.prioritas==='hi'?'a':n.prioritas==='mid'?'b':'g'}">${n.tipe}</span></div>
      <div class="act">${(n.aksi||[]).map(a=>`<button class="pri" onclick="doNotifAction('${a.t}','${a.v}','${n.id}')">${E(a.l)}</button>`).join('')}<button onclick="markNotif('${n.id}','handled')">✓ Ditangani</button><button onclick="markNotif('${n.id}','snooze')">Tunda</button><button onclick="clearNotif('${n.id}')">Hapus</button></div>
      </div></div>`).join('')
    :`<div class="card"><div class="empty"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>tidak ada notifikasi ${tab==='new'?'aktif':'di sini'}.</div></div>`}
  ${all.length?`<button class="btn ghost block" onclick="clearAllNotif()">Hapus semua notifikasi</button>`:''}`;
}
function doNotifAction(t,v,id){
  markNotif(id,'handled');
  if(t==='go') go(v);
  else if(t==='paybill') payBill(v);
}

/* ===================== LAPORAN ===================== */
function renderLaporan(){
  // 6 bulan cashflow
  const series=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const mk=d.toISOString().slice(0,7); const trxs=trxByMonth(mk); const net=sumIn(trxs)-sumOut(trxs); series.push({label:MONTHS[d.getMonth()],val:net}); }
  // kategori pengeluaran bulan ini (donut)
  const mk=monthKey(); const catsOut=[]; const totOut=sumOut(trxByMonth(mk));
  D().kategori.filter(k=>k.tipe==='out').forEach(k=>{ const s=spentByKat(k.id,mk); if(s>0) catsOut.push({nama:k.nama,val:s,color:k.warna,ikon:k.ikon}); });
  catsOut.sort((a,b)=>b.val-a.val);
  const top5=catsOut.slice(0,5); const otherSum=catsOut.slice(5).reduce((a,c)=>a+c.val,0);
  const donutSegs=top5.map(c=>({val:c.val,color:c.color})); if(otherSum>0)donutSegs.push({val:otherSum,color:'#8a98ab'});
  // abnormal
  const ab=abnormalSpending().slice(0,3);
  // top transaksi terbesar
  const top=trxByMonth(mk).filter(t=>t.tipe==='out').sort((a,b)=>b.jumlah-a.jumlah).slice(0,5);
  $('v-laporan').innerHTML=`
  <div class="hdr">Laporan<div class="sub">Analisis 6 bulan terakhir · ${MONTHS[new Date().getMonth()]} ${new Date().getFullYear()}</div></div>

  <div class="card">
    <h3>Arus Kas 6 Bulan <span class="chip ${series[series.length-1].val>=0?'g':'r'}">${series[series.length-1].val>=0?'Surplus':'Defisit'}</span></h3>
    ${lineChart(series)}
    <div class="muted xs" style="margin-top:4px">Hijau = surplus (pemasukan > pengeluaran), merah = defisit.</div>
  </div>

  <div class="card">
    <h3>Pengeluaran per Kategori <span class="muted ml xs">${MONTHS[new Date().getMonth()]}</span></h3>
    ${catsOut.length?`<div class="row" style="gap:12px"><div>${donut(donutSegs,140,26)}</div><div class="grow legend">${(top5.concat(otherSum>0?[{nama:'Lainnya',val:otherSum,color:'#8a98ab'}]:[])).map(c=>`<div class="it"><span class="d" style="background:${c.color}"></span>${E(c.nama)}<span class="v">${R(c.val)}</span></div>`).join('')}</div></div>`
      :`<div class="empty xs">Belum ada pengeluaran bulan ini.</div>`}
  </div>

  <div class="card">
    <h3>📈 Deteksi Pengeluaran Abnormal</h3>
    ${ab.length?ab.map(a=>`<div class="li"><div class="ic-c" style="background:${a.kategori.warna}22">${a.kategori.ikon}</div><div class="grow"><div class="nm">${E(a.kategori.nama)}</div><div class="sb">${R(a.cur)} vs rata-rata ${R(a.avg)}</div></div><div class="chip a">+${a.pct}%</div></div>`).join('')
      :`<div class="empty xs">Tidak ada pengeluaran abnormal bulan ini ✨</div>`}
  </div>

  <div class="card">
    <h3>Pengeluaran Terbesar <span class="muted ml xs">bulan ini</span></h3>
    ${top.length?`<div class="list">${top.map(t=>{const k=KAT(t.kategori_id);return `<div class="li"><div class="ic-c" style="background:${k.warna}22">${k.ikon}</div><div class="grow"><div class="nm">${E(t.deskripsi||k.nama)}</div><div class="sb">${fmtDateShort(t.tgl)}</div></div><div class="v out">${R(t.jumlah)}</div></div>`}).join('')}</div>`:`<div class="empty xs">Belum ada data.</div>`}
  </div>

  <div class="card">
    <h3>Ringkasan ${MONTHS[new Date().getMonth()]}</h3>
    <div class="hb"><span class="nm">Pemasukan</span><span class="v" style="color:var(--pri)">${R(sumIn(trxByMonth(mk)))}</span></div>
    <div class="hb"><span class="nm">Pengeluaran</span><span class="v" style="color:var(--red)">${R(sumOut(trxByMonth(mk)))}</span></div>
    <div class="hb"><span class="nm">Arus kas bersih</span><span class="v">${R(sumIn(trxByMonth(mk))-sumOut(trxByMonth(mk)))}</span></div>
    <div class="hb"><span class="nm">Saldo total</span><span class="v">${R(totalSaldo())}</span></div>
    <div class="hb"><span class="nm">Rata-rata pengeluaran/hari</span><span class="v">${R(sumOut(trxByMonth(mk))/Math.max(1,new Date().getDate()))}</span></div>
    <button class="btn ghost block sm" style="margin-top:10px" onclick="exportCSV()">⬇ Ekspor CSV (Excel/Sheets)</button>
  </div>`;
}

function toggleNotif(k,el){ D().pengaturan.notif[k]=el.classList.contains('on')?0:1; el.classList.toggle('on'); savePengaturan(); }
