/* ===================== SHEET / FORMS ===================== */
function openSheet(title, body){ $('sheetBody').innerHTML=`<h2>${E(title)}<span class="x" onclick="closeSheet()">✕</span></h2>${body}`; $('scrim').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }

function openAdd(type){
  type=type||'out';
  if(type==='in'||type==='out'||type==='transfer') return openTrxForm(type);
  if(type==='bill') return openBillForm();
  if(type==='goal') return openGoalForm();
  if(type==='budget') return openBudgetForm();
}

function katOpts(tipe, sel){ return D().kategori.filter(k=>k.tipe===tipe).map(k=>`<option value="${k.id}" ${sel===k.id?'selected':''}>${k.ikon} ${E(k.nama)}</option>`).join(''); }
function rekOpts(sel){ return D().rekening.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${E(r.nama)}</option>`).join(''); }

/* ===== input cepat: ketuk angka, bukan ketik ===== */
// input cepat: ketuk angka / nama, bukan ketik.
// setVal, amtAdd, amtClear memakai document.getElementById (bukan $) supaya
// pasti terjangkau dari onclick inline di semua browser.
function setVal(id,val){ const el=document.getElementById(id); if(el){ el.value=val; } }
function amtField(id,label,presets,val){
  const v=(val!=null && +val>0)?(+val).toLocaleString('id-ID'):'';
  const chips=(presets||[10000,50000,100000,500000,1000000]).map(p=>`<button type="button" class="amt-c" onclick="amtAdd('${id}',${p})">${amtShort(p)}</button>`).join('');
  return `<div class="fld"><label>${label}</label>
    <div class="amt-row"><input id="${id}" class="rp" inputmode="numeric" placeholder="0" value="${v}"><button type="button" class="amt-clr" onclick="amtClear('${id}')" title="Hapus">×</button></div>
    <div class="amt-pick">${chips}</div></div>`;
}
function amtShort(v){ if(v>=1000000){const m=v/1000000; return (m%1===0?m:m.toFixed(1))+'jt';} if(v>=1000) return (v/1000)+'rb'; return ''+v; }
function amtAdd(id,val){ const el=document.getElementById(id); if(!el)return; el.value=(rp2num(el.value)+val).toLocaleString('id-ID'); el.style.background='var(--pri-l)'; setTimeout(()=>el.style.background='',220); }
function amtClear(id){ const el=document.getElementById(id); if(!el)return; el.value=''; el.focus(); }
// chip nama cepat (mis. "Internet", "Listrik") → mengisi input target
function nameChips(targetId,names){ return `<div class="quick-names">${names.map(n=>`<button type="button" onclick="setVal('${targetId}','${E(n)}')">${E(n)}</button>`).join('')}</div>`; }

function openTrxForm(tipe, prefill){
  const defKat = tipe==='in'?'k1':'k10';
  const body=`
  <div class="seg" id="_tipeSeg">
    <button class="${tipe==='in'?'on':''}" onclick="_setTipe='in';_syncSeg()">Pemasukan</button>
    <button class="${tipe==='out'?'on':''}" onclick="_setTipe='out';_syncSeg()">Pengeluaran</button>
    <button class="${tipe==='transfer'?'on':''}" onclick="_setTipe='transfer';_syncSeg()">Transfer</button>
  </div>
  <div id="_trxFormBody"></div>
  <div class="row" style="gap:8px;margin-top:6px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveTrx()">Simpan</button></div>`;
  window._setTipe=tipe; window._editTrx=null; window._prefill=prefill||null;
  openSheet(tipe==='in'?'Tambah Pemasukan':tipe==='out'?'Tambah Pengeluaran':'Transfer', body);
  _syncSeg();
}
function _syncSeg(){
  document.querySelectorAll('#_tipeSeg button').forEach((b,i)=>{ const m=['in','out','transfer'][i]; b.classList.toggle('on',m===_setTipe); });
  const t=_setTipe;
  const kats = t==='in'?katOpts('in','k1'):katOpts('out','k10');
  $('_trxFormBody').innerHTML=`
    <div class="grid2">
      <div class="fld"><label>Tanggal</label><input type="date" id="_fTgl" value="${todayISO()}"></div>
      <div class="fld"><label>Rekening</label><select id="_fRek">${rekOpts(D().rekening[0]&&D().rekening[0].id)}</select></div>
    </div>
    ${t==='transfer'?`<div class="fld"><label>Ke rekening</label><select id="_fRekTo">${rekOpts(D().rekening[1]?D().rekening[1].id:'')}</select></div>`:''}
    ${t!=='transfer'?`<div class="fld"><label>Kategori</label><select id="_fKat">${kats}</select></div>`:''}
    ${amtField('_fJml', t==='in'?'Jumlah diterima':t==='transfer'?'Jumlah ditransfer':'Jumlah pengeluaran', [10000,25000,50000,100000,200000,500000,1000000,2000000])}
    <div class="fld"><label>Keterangan</label><input id="_fDesc" placeholder="cth: Gaji bulan Nov"></div>`;
  if(window._prefill){
    const p=window._prefill; window._prefill=null;
    if(p.amount) setVal('_fJml', (+p.amount).toLocaleString('id-ID'));
    if(p.from) setVal('_fRek', p.from);
    if(p.to && t==='transfer') setVal('_fRekTo', p.to);
    if(p.desc) setVal('_fDesc', p.desc);
  }
}
function saveTrx(){
  const t=_setTipe; const jml=rp2num($('_fJml').value);
  if(jml<=0){toast('Isi jumlah dengan benar',1);return;}
  if(t==='transfer' && $('_fRek').value===$('_fRekTo').value){toast('Rekening asal & tujuan sama',1);return;}
  const row={ id:uid('trx'), tgl:$('_fTgl').value, tipe:t, rekening_id:$('_fRek').value, jumlah:jml, deskripsi:$('_fDesc').value };
  if(t==='transfer') row.ke_rekening_id=$('_fRekTo').value; else row.kategori_id=$('_fKat').value;
  mutate('transaksi','add',row); closeSheet(); toast(t==='in'?'Pemasukan dicatat':t==='transfer'?'Transfer dicatat':'Pengeluaran dicatat');
}

function openBudgetForm(){
  const used=D().anggaran.filter(a=>a.bulan===monthKey()).map(a=>a.kategori_id);
  const opts=D().kategori.filter(k=>k.tipe==='out' && !used.includes(k.id)).map(k=>`<option value="${k.id}">${k.ikon} ${E(k.nama)}</option>`).join('');
  openSheet('Tambah Anggaran', `
    <div class="fld"><label>Bulan</label><input type="month" id="_bBulan" value="${monthKey()}"></div>
    <div class="fld"><label>Kategori</label><select id="_bKat">${opts||'<option>Tidak ada kategori tersedia</option>'}</select></div>
    ${amtField('_bBatas','Batas pengeluaran',[500000,750000,1000000,1500000,2000000,3000000,5000000])}
    <div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveBudget()">Simpan</button></div>`);
}
function saveBudget(){ const kat=$('_bKat').value; const batas=rp2num($('_bBatas').value); if(!kat||batas<=0){toast('Lengkapi data',1);return;} mutate('anggaran','add',{id:uid('bud'),kategori_id:kat,bulan:$('_bBulan').value,batas:batas}); closeSheet(); toast('Anggaran dibuat'); }

function openBillForm(editId){
  const b=editId?D().tagihan.find(x=>x.id===editId):{nama:'',jumlah:0,jatuh_tempo:todayISO(),frekuensi:'bulanan',kategori_id:'k14',status:'belum'};
  openSheet(editId?'Edit Tagihan':'Tambah Tagihan', `
    <div class="fld"><label>Nama tagihan</label><input id="_blNama" value="${E(b.nama)}" placeholder="cth: Internet"></div>
    ${nameChips('_blNama',['Internet','Listrik','Air','Kontrakan','BPJS','Netflix','Spotify','Gas'])}
    ${amtField('_blJml','Jumlah',[50000,100000,150000,200000,350000,500000,1000000,1500000], b.jumlah)}
    <div class="grid2"><div class="fld"><label>Jatuh tempo</label><input type="date" id="_blDue" value="${b.jatuh_tempo}"></div>
    <div class="fld"><label>Frekuensi</label><select id="_blFreq"><option ${b.frekuensi==='bulanan'?'selected':''}>bulanan</option><option ${b.frekuensi==='mingguan'?'selected':''}>mingguan</option><option ${b.frekuensi==='tahunan'?'selected':''}>tahunan</option><option ${b.frekuensi==='sekali'?'selected':''}>sekali</option></select></div></div>
    <div class="fld"><label>Kategori</label><select id="_blKat">${katOpts('out',b.kategori_id)}</select></div>
    <div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveBill('${editId||''}')">Simpan</button></div>`);
}
function saveBill(id){ const row={id:id||uid('bill'),nama:$('_blNama').value,jumlah:rp2num($('_blJml').value),jatuh_tempo:$('_blDue').value,frekuensi:$('_blFreq').value,kategori_id:$('_blKat').value,status:id?D().tagihan.find(x=>x.id===id).status:'belum'}; if(!row.nama||row.jumlah<=0){toast('Lengkapi',1);return;} mutate('tagihan',id?'upd':'add',row); closeSheet(); toast('Tagihan disimpan'); }
function payBill(id){ const b=D().tagihan.find(x=>x.id===id); if(!b)return; b.status='lunas'; mutate('tagihan','upd',b); // catat pengeluaran otomatis
  mutate('transaksi','add',{id:uid('trx'),tgl:todayISO(),tipe:'out',kategori_id:b.kategori_id,rekening_id:(D().rekening[0]||{}).id,deskripsi:'Bayar '+b.nama,jumlah:b.jumlah}); toast('Tagihan ditandai lunas'); }
function delBill(id){ if(!confirm('Hapus tagihan?'))return; mutate('tagihan','del',{id}); toast('Dihapus'); }

function openGoalForm(editId){
  const g=editId?D().target.find(x=>x.id===editId):{nama:'',target_jumlah:0,terkumpul:0,target_tanggal:futureISO(180),prioritas:'sedang',setoran_bulanan:0};
  function futureISO(d){ const x=new Date(); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }
  openSheet(editId?'Edit Target':'Tambah Target', `
    <div class="fld"><label>Nama target</label><input id="_gNama" value="${E(g.nama)}" placeholder="cth: Laptop baru"></div>
    ${nameChips('_gNama',['Laptop','Motor','Mobil','Rumah','Liburan','Modal usaha','Dana darurat','Pendidikan'])}
    ${amtField('_gTarget','Target jumlah',[5000000,10000000,15000000,20000000,25000000,50000000,100000000], g.target_jumlah)}
    ${amtField('_gKumpul','Sudah terkumpul',[500000,1000000,2000000,5000000,10000000], g.terkumpul)}
    <div class="grid2"><div class="fld"><label>Target tanggal</label><input type="date" id="_gDate" value="${g.target_tanggal}"></div>
    <div class="fld"><label>Prioritas</label><select id="_gPri"><option ${g.prioritas==='tinggi'?'selected':''}>tinggi</option><option ${g.prioritas==='sedang'?'selected':''}>sedang</option><option ${g.prioritas==='rendah'?'selected':''}>rendah</option></select></div></div>
    ${amtField('_gSetor','Setoran bulanan',[100000,250000,500000,750000,1000000,2000000], g.setoran_bulanan)}
    <div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveGoal('${editId||''}')">Simpan</button></div>`);
}
function saveGoal(id){ const row={id:id||uid('goal'),nama:$('_gNama').value,target_jumlah:rp2num($('_gTarget').value),terkumpul:rp2num($('_gKumpul').value),target_tanggal:$('_gDate').value,prioritas:$('_gPri').value,setoran_bulanan:rp2num($('_gSetor').value)}; if(!row.nama||row.target_jumlah<=0){toast('Lengkapi',1);return;} mutate('target',id?'upd':'add',row); closeSheet(); toast('Target disimpan'); }
function editGoal(id){ openGoalForm(id); }
function delGoal(id){ if(!confirm('Hapus target?'))return; mutate('target','del',{id}); toast('Dihapus'); }
function addContribution(id){ const g=D().target.find(x=>x.id===id); if(!g)return; const amt=prompt('Setoran untuk "'+g.nama+'":', '500000'); if(amt==null)return; const a=rp2num(amt); if(a<=0)return; g.terkumpul=(+g.terkumpul||0)+a; mutate('target','upd',g); // catat sebagai transaksi tabungan
  const tk=D().kategori.find(k=>k.tipe==='out'&&/tabungan/i.test(k.nama)); if(tk) mutate('transaksi','add',{id:uid('trx'),tgl:todayISO(),tipe:'out',kategori_id:tk.id,rekening_id:(D().rekening[0]||{}).id,deskripsi:'Setor target '+g.nama,jumlah:a}); toast('Setoran ditambahkan'); }

function openDebtForm(editId){
  const u=editId?D().utang.find(x=>x.id===editId):{nama:'',total:0,sisa:0,cicilan:0,bunga:0,jatuh_tempo:todayISO(),frekuensi:'bulanan'};
  openSheet(editId?'Edit Utang':'Tambah Utang', `
    <div class="fld"><label>Nama utang</label><input id="_uNama" value="${E(u.nama)}" placeholder="cth: Kartu kredit BCA"></div>
    ${nameChips('_uNama',['Kartu kredit','KTA','Kredit motor','Kredit mobil','Pinjaman online','Koperasi'])}
    ${amtField('_uTotal','Total utang',[1000000,5000000,10000000,15000000,20000000,50000000], u.total)}
    ${amtField('_uSisa','Sisa utang',[500000,1000000,5000000,10000000,20000000], u.sisa)}
    ${amtField('_uCicil','Cicilan/bulan',[250000,500000,750000,1000000,2000000,3000000], u.cicilan)}
    <div class="grid2"><div class="fld"><label>Bunga %/bln</label><input id="_uBunga" value="${u.bunga}" inputmode="decimal"></div>
    <div class="fld"><label>Jatuh tempo</label><input type="date" id="_uDue" value="${u.jatuh_tempo}"></div></div>
    <div class="fld"><label>Frekuensi</label><select id="_uFreq"><option ${u.frekuensi==='bulanan'?'selected':''}>bulanan</option><option ${u.frekuensi==='mingguan'?'selected':''}>mingguan</option></select></div>
    <div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveDebt('${editId||''}')">Simpan</button></div>`);
}
function saveDebt(id){ const row={id:id||uid('debt'),nama:$('_uNama').value,total:rp2num($('_uTotal').value),sisa:rp2num($('_uSisa').value),cicilan:rp2num($('_uCicil').value),bunga:+num($('_uBunga').value),jatuh_tempo:$('_uDue').value,frekuensi:$('_uFreq').value}; if(!row.nama||row.total<=0){toast('Lengkapi',1);return;} mutate('utang',id?'upd':'add',row); closeSheet(); toast('Utang disimpan'); }
function editDebt(id){ openDebtForm(id); }
function delDebt(id){ if(!confirm('Hapus utang?'))return; mutate('utang','del',{id}); toast('Dihapus'); }
function payDebt(id){ const u=D().utang.find(x=>x.id===id); if(!u)return; const a=Math.min(+u.cicilan||0,+u.sisa||0); if(a<=0){toast('Tidak ada cicilan',1);return;} u.sisa=Math.max(0,(+u.sisa)-a); mutate('utang','upd',u); const kd=D().kategori.find(k=>k.tipe==='out'&&/cicilan|utang/i.test(k.nama)); mutate('transaksi','add',{id:uid('trx'),tgl:todayISO(),tipe:'out',kategori_id:kd?kd.id:'k16',rekening_id:(D().rekening[0]||{}).id,deskripsi:'Bayar cicilan '+u.nama,jumlah:a}); toast('Cicilan '+R(a)+' dibayar'); }

function openEmergency(){
  const dd=D().danaDarurat;
  openSheet('Atur Dana Darurat', `
    <div class="hint"><b>Cara hitung:</b> Target dana darurat = 6 × (biaya hidup pokok + cicilan utang/bulan) untuk IDEAL, atau 3 × untuk MINIMUM. Cicilan diambil otomatis dari daftar Utang — baris "cicilan/utang" di daftar ini diabaikan agar tidak dihitung dua kali.</div>
    <div class="fld"><label>Rekening yang dianggap dana darurat (opsional)</label><select id="_ddRek"><option value="">— Otomatis (rekening "darurat") —</option>${D().rekening.map(r=>`<option value="${r.id}" ${D().pengaturan.danaDaruratRekening===r.id?'selected':''}>${E(r.nama)}</option>`).join('')}</select></div>
    <div class="div"></div>
    <h3 style="font-size:14px;margin-bottom:8px">Kebutuhan pokok bulanan</h3>
    <div id="_ddList">${dd.map((x,i)=>`<div class="grid2" style="margin-bottom:8px"><div class="fld" style="margin:0"><input id="_ddN${i}" value="${E(x.kategori_kebutuhan)}"></div><div class="fld" style="margin:0"><input id="_ddJ${i}" class="rp" value="${(+x.jumlah_bulanan).toLocaleString('id-ID')}" inputmode="numeric"></div></div>`).join('')}</div>
    ${dd.length?'':'<div class="hint" style="margin:8px 0">Belum ada kebutuhan pokok yang diisi — tambahkan baris manual atau pakai contoh (semua angka bisa diubah sebelum disimpan).</div>'}
    <div class="row" style="gap:8px;margin-bottom:10px"><button class="btn ghost grow sm" onclick="addDDRow()">+ Tambah baris</button><button class="btn ghost sm" onclick="fillDDContoh()">Pakai contoh</button></div>
    <div class="banner b"><span class="em">📊</span><div id="_ddTotal">Beban/bulan: ${R(biayaHidupPokok())} hidup + ${R(cicilanBulanan())} cicilan = <b>${R(bebanBulanan())}</b></div></div>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveEmergency()">Simpan</button></div>`);
}
function fillDDContoh(){ const list=$('_ddList'); DEF_DD.forEach(x=>{ const i=list.querySelectorAll('.grid2').length; const c=document.createElement('div'); c.className='grid2'; c.style.marginBottom='8px'; c.innerHTML=`<div class="fld" style="margin:0"><input id="_ddN${i}" value="${E(x.kategori_kebutuhan)}"></div><div class="fld" style="margin:0"><input id="_ddJ${i}" class="rp" value="${(+x.jumlah_bulanan).toLocaleString('id-ID')}" inputmode="numeric"></div>`; list.appendChild(c); }); }
function addDDRow(){ const i=document.querySelectorAll('#_ddList .grid2').length; const c=document.createElement('div'); c.className='grid2'; c.style.marginBottom='8px'; c.innerHTML=`<div class="fld" style="margin:0"><input id="_ddN${i}" placeholder="cth: Pendidikan"></div><div class="fld" style="margin:0"><input id="_ddJ${i}" class="rp" inputmode="numeric" placeholder="0"></div>`; $('_ddList').appendChild(c); }
function saveEmergency(){ const rows=[]; document.querySelectorAll('#_ddList .grid2').forEach((g,i)=>{ const n=$('_ddN'+i), j=$('_ddJ'+i); if(n&&j&&n.value.trim()){ rows.push({id:uid2(),kategori_kebutuhan:n.value.trim(),jumlah_bulanan:rp2num(j.value)}); } }); D().danaDarurat=rows; D().pengaturan.danaDaruratRekening=$('_ddRek').value; savePengaturan(); pushQ({t:'danaDarurat',op:'replace',rows}); closeSheet(); toast('Konfigurasi dana darurat disimpan'); }

function openIncome(){
  const inc=penghasilanInfo();
  openSheet('Penghasilan bulanan', `
    <div class="hint">Dipakai untuk menghitung rasio cicilan & rekomendasi target dana darurat. ${inc.src==='estimasi'?'Saat ini memakai <b>estimasi dari transaksi</b> — isi angka pasti agar akurat.':''}</div>
    ${amtField('_incV','Penghasilan per bulan',[3000000,5000000,8000000,10000000,15000000,20000000,30000000], D().pengaturan.penghasilanBulanan)}
    <div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveIncome()">Simpan</button></div>`);
}
function saveIncome(){ const v=rp2num($('_incV').value); if(v<=0){toast('Isi penghasilan dengan benar',1);return;} D().pengaturan.penghasilanBulanan=v; savePengaturan(); closeSheet(); toast('Penghasilan disimpan'); }
function quickDepositDD(){
  const set=D().pengaturan;
  const dd=D().rekening.find(x=>x.id===set.danaDaruratRekening)||D().rekening.find(x=>/darurat|emergency/i.test(x.nama))||null;
  if(!dd){ toast('Beri nama salah satu rekening "darurat" agar setor otomatis',2); openTrxForm('transfer'); return; }
  const rk=rekomDanaDarurat();
  const from=(D().rekening.find(x=>x.id!==dd.id)||{}).id;
  openTrxForm('transfer',{from, to:dd.id, amount:rk.saran>0?rk.saran:500000, desc:'Setor dana darurat'});
}

function openAlokasi(){
  const a=D().pengaturan.alokasi;
  openSheet('Alokasi Penghasilan', `
    <div class="hint"><b>Tidak harus dikunci.</b> Sistem menyesuaikan dengan kondisi Anda. Atur persentase sendiri, total harus 100%.</div>
    ${[['kebutuhan','Kebutuhan','#2f6fd6'],['tabungan','Tabungan & dana darurat','#0f9d6b'],['investasi','Investasi','#34d399'],['hiburan','Keinginan & hiburan','#e8780a'],['bebas','Dana bebas','#a855f7']].map(([k,l,c])=>`<div class="fld"><label><span class="tag-dot" style="background:${c}"></span> ${l}</label><div class="row"><input type="range" id="_al${k}" min="0" max="60" value="${a[k]||0}" oninput="_alSum()" style="flex:1"><input id="_alV${k}" value="${a[k]||0}%" style="width:54px;text-align:center;font-weight:700" readonly></div></div>`).join('')}
    <div class="banner b" id="_alBox"><span class="em">∑</span><div id="_alTotal">Total: ${Object.values(a).reduce((s,v)=>s+(+v||0),0)}%</div></div>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="saveAlokasi()">Simpan</button></div>`);
}
function _alSum(){ const keys=['kebutuhan','tabungan','investasi','hiburan','bebas']; let t=0; keys.forEach(k=>{ const v=+$('_al'+k).value; $('_alV'+k).value=v+'%'; t+=v; }); $('_alTotal').textContent='Total: '+t+'%'; $('_alBox').className='banner '+(t===100?'g':(t>100?'r':'a')); }
function saveAlokasi(){ const keys=['kebutuhan','tabungan','investasi','hiburan','bebas']; const o={}; let t=0; keys.forEach(k=>{o[k]=+$('_al'+k).value;t+=o[k];}); if(t!==100){toast('Total harus 100% (saat ini '+t+'%)',1);return;} D().pengaturan.alokasi=o; savePengaturan(); closeSheet(); toast('Alokasi disimpan'); }

/* ===================== DATA MANAGEMENT ===================== */
function exportCSV(){
  const rows=[['Tanggal','Tipe','Kategori','Rekening','Keterangan','Jumlah']];
  D().transaksi.forEach(t=>rows.push([t.tgl,t.tipe,KAT(t.kategori_id).nama,REK(t.rekening_id).nama,t.deskripsi,t.jumlah]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='smartfin-transaksi-'+todayISO()+'.csv'; a.click(); toast('CSV terunduh');
}
function exportJSON(){ const blob=new Blob([JSON.stringify(D(),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='smartfin-backup-'+todayISO()+'.json'; a.click(); toast('Backup terunduh'); }
function importJSON(){ const i=document.createElement('input'); i.type='file'; i.accept='.json'; i.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); S.d=normalizeD(d); persist(); recomputeAll(); toast('Data dipulihkan'); }catch(err){toast('File tidak valid',1);} }; r.readAsText(f); }; i.click(); }
function resetData(){ if(!confirm('Reset SEMUA data? Semua catatan akan DIKOSONGKAN dan aplikasi kembali seperti baru. Tindakan ini tidak bisa dibatalkan.'))return; localStorage.removeItem('sf_d'); S.d=JSON.parse(JSON.stringify(KOSONG)); persist(); recomputeAll(); toast('Semua data dikosongkan'); }

/* ===================== INIT ===================== */
// format input rupiah saat diketik
document.addEventListener('input', e=>{ const t=e.target; if(t.classList&&t.classList.contains('rp')){
    const n=t.value.replace(/[^\d]/g,''); t.value=n?(+n).toLocaleString('id-ID'):'';
    // update total beban live (baris bernama cicilan/utang diabaikan — diambil dari daftar Utang)
    if(t.closest('#_ddList')){ let tot=0; document.querySelectorAll('#_ddList .grid2').forEach(g=>{ const nm=g.querySelector('input:not(.rp)'), j=g.querySelector('input.rp'); if(nm&&j&&!/cicilan|utang|angsuran/i.test(nm.value||'')) tot+=rp2num(j.value); });
      if($('_ddTotal'))$('_ddTotal').textContent='Beban/bulan: '+R(tot)+' hidup + '+R(cicilanBulanan())+' cicilan = '+R(tot+cicilanBulanan()); }
  } });
// tutup sheet saat tekan Esc
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

// === PWA: service worker (cache offline) + tombol pasang aplikasi ===
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
let _pwaEvt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); _pwaEvt=e; const b=$('installBtn'); if(b) b.classList.add('show'); });
(function(){
  const b=$('installBtn'); if(!b) return;
  b.addEventListener('click', async ()=>{
    if(!_pwaEvt) return;
    _pwaEvt.prompt();
    try{ await _pwaEvt.userChoice; }catch(e){}
    _pwaEvt=null;
    b.classList.remove('show');
  });
})();
window.addEventListener('appinstalled', ()=>{ const b=$('installBtn'); if(b) b.classList.remove('show'); });

// mulai
boot();
</script>
</body>
</html>
