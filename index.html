<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SmartFin Bisnis">
<title>SmartFin Bisnis — Catatan Keuangan Usaha</title>
<style>
:root{
  --pri:#0f9d6b; --pri-d:#0c8159; --pri-l:#e7f7ee;
  --amber:#e8780a; --amber-l:#fdf0dd;
  --red:#d93b3b; --red-l:#fdeaea;
  --blue:#2f6fd6; --blue-l:#e8f0fc;
  --purple:#7c5fd6; --purple-l:#f0eafc;
  --ink:#1a2332; --mut:#5a6a7e; --mut2:#8a98ab;
  --bg:#f3f6f9; --card:#fff; --line:#e7ecf2; --line2:#eef2f7;
  --sh:0 1px 3px rgba(20,40,80,.06),0 4px 16px rgba(20,40,80,.05);
  --sh-lg:0 8px 32px rgba(20,40,80,.10);
  --r:16px; --r-s:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.r{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:78px;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:rgba(243,246,249,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#34d399);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;box-shadow:0 3px 10px rgba(15,157,107,.3)}
.brand b{font-size:16px;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:500;margin-top:1px}
.wrap{padding:12px 16px 24px}

.navbot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}
.navbot .in{display:flex;width:100%;max-width:560px}
.navbot a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--mut2);font-size:11px;font-weight:600;text-decoration:none;transition:color .15s}
.navbot a.on{color:var(--pri)}
.navbot a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:15px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.card h3 .chip{margin-left:auto;text-transform:none;letter-spacing:0}
.big{font-size:28px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.big.sm2{font-size:22px}
.lg-num{font-size:30px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.xs{font-size:11px}
.sm{font-size:13px}

.qa3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.qa3 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;font-weight:700;font-size:12.5px;color:#fff;transition:transform .08s}
.qa3 button:active{transform:scale(.96)}
.qa3 button.in{background:var(--pri)} .qa3 button.out{background:var(--red)} .qa3 button.sav{background:var(--blue)}
.qa3 button svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi2 .b{background:var(--card);border-radius:13px;padding:12px;box-shadow:var(--sh)}
.kpi2 .b .lbl{font-size:11px;color:var(--mut);font-weight:600}
.kpi2 .b .v{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi2 .b.in .v{color:var(--pri)} .kpi2 .b.out .v{color:var(--red)} .kpi2 .b.sav .v{color:var(--blue)} .kpi2 .b.bal .v{color:var(--ink)}

.prog{height:9px;border-radius:6px;background:var(--line2);overflow:hidden}
.prog .f{height:100%;border-radius:6px;background:var(--pri);transition:width .4s}
.prog .f.a{background:var(--amber)} .prog .f.r{background:var(--red)} .prog .f.b{background:var(--blue)}

.banner{border-radius:13px;padding:12px 13px;font-size:13.5px;font-weight:600;display:flex;gap:9px;align-items:flex-start;margin-bottom:12px;line-height:1.45}
.banner .em{font-size:18px;flex-shrink:0;line-height:1.1}
.banner.g{background:var(--pri-l);color:var(--pri-d)} .banner.a{background:var(--amber-l);color:var(--amber)} .banner.r{background:var(--red-l);color:var(--red)} .banner.b{background:var(--blue-l);color:var(--blue)}

.tip{background:linear-gradient(135deg,var(--pri-l),var(--blue-l));border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--pri)}
.tip .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tip .h .em{font-size:22px;line-height:1}
.tip .h .t{font-weight:800;font-size:14px;color:var(--pri-d)}
.tip .p{font-size:13.5px;color:var(--ink);line-height:1.55}
.tip .p b{color:var(--pri-d)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.li .nm{font-weight:600;font-size:14px;line-height:1.2}
.li .sb{font-size:11.5px;color:var(--mut);margin-top:1px}
.li .v{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.li .v.in{color:var(--pri)} .li .v.out{color:var(--ink)} .li .v.sav{color:var(--blue)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:14px;border:0;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.block{display:flex;width:100%}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.fld input.rp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.amt-row{display:flex;gap:8px}
.amt-row input{flex:1}
.amt-row .amt-clr{width:44px;flex-shrink:0;border-radius:11px;background:var(--line2);color:var(--mut);font-size:20px;font-weight:700;line-height:1;border:0;cursor:pointer}
.amt-row .amt-clr:active{background:var(--red-l);color:var(--red)}
.amt-pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.amt-pick .amt-c{padding:7px 11px;border-radius:10px;background:var(--pri-l);color:var(--pri-d);font-weight:700;font-size:12px;border:0;cursor:pointer}
.amt-pick .amt-c:active{transform:scale(.94);background:var(--pri);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(15,25,45,.5);z-index:40;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;z-index:41;opacity:0;visibility:hidden;transform:translateY(100%);transition:transform .25s,opacity .2s,visibility .2s;max-height:92vh;overflow-y:auto;padding:8px 16px 24px}
.sheet.on{opacity:1;visibility:visible;transform:translateY(0)}
.sheet .handle{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:18px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:16px;color:var(--mut);cursor:pointer;border:0}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:60;max-width:90%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}

.fab{position:fixed;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(15,157,107,.45);z-index:25;border:0;cursor:pointer}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}

.empty{text-align:center;padding:28px 16px;color:var(--mut)}
.empty svg{width:44px;height:44px;opacity:.35;margin:0 auto 8px;fill:none;stroke:var(--mut);stroke-width:1.5}

.splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--pri),#0c8159);display:grid;place-items:center;z-index:90;text-align:center;color:#fff}
.splash .lg{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 14px;backdrop-filter:blur(6px)}
.splash b{font-size:20px}
.splash p{opacity:.85;font-size:12.5px;margin-top:6px}

.login{position:fixed;inset:0;z-index:1001;display:none;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef3fa,#dfe9f5);padding:20px}
.login .c{background:#fff;border-radius:20px;padding:26px 20px;max-width:360px;width:100%;box-shadow:0 12px 44px rgba(20,40,80,.16);text-align:center}
.login .lg{margin:0 auto 10px;width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--pri),#34d399);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}

.view{display:none}.view.on{display:block}
.hdr{font-size:20px;font-weight:800;padding:4px 0 8px;letter-spacing:-.3px}
.hdr .sub{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--line2);color:var(--mut)}
.chip.g{background:var(--pri-l);color:var(--pri-d)} .chip.a{background:var(--amber-l);color:var(--amber)} .chip.r{background:var(--red-l);color:var(--red)} .chip.b{background:var(--blue-l);color:var(--blue)}
.hint{font-size:12.5px;color:var(--mut);background:var(--blue-l);border-radius:10px;padding:10px 12px;line-height:1.55}
.hint b{color:var(--blue)}
.between{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.toggle{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);flex-shrink:0;transition:.2s;cursor:pointer}
.toggle.on{background:var(--pri)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.toggle.on::after{left:21px}
.tg-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.tg-row:last-child{border-bottom:0}
.tg-row .lb{font-size:13.5px;font-weight:600}
.tg-row .lb small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:1px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}

/* Bell button dengan badge */
.bell{position:relative;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.bell:active{transform:scale(.94)}
.bell svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bell .bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.bell.has .bdg{display:flex}
.bell.has{animation:bellpulse 2s infinite}
@keyframes bellpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
/* Alert list di sheet */
.alert{display:flex;gap:11px;padding:12px;border-radius:13px;background:var(--card);margin-bottom:9px;box-shadow:var(--sh);border-left:4px solid var(--mut)}
.alert.r{border-left-color:var(--red)} .alert.a{border-left-color:var(--amber)} .alert.b{border-left-color:var(--blue)} .alert.g{border-left-color:var(--pri)}
.alert .em{font-size:20px;flex-shrink:0;line-height:1.2}
.alert .bd{flex:1;min-width:0}
.alert .bd .t{font-weight:700;font-size:13.5px;line-height:1.25}
.alert .bd .m{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.alert .bd .m b{color:var(--ink)}

/* Baris biaya bulanan dengan tombol hapus */
.biaya-row{display:grid;grid-template-columns:1fr 1fr 38px;gap:8px;margin-bottom:8px;align-items:start}
.biaya-row .fld{margin:0}
.biaya-del{width:38px;height:42px;border-radius:11px;background:var(--red-l);color:var(--red);font-size:20px;font-weight:700;border:0;cursor:pointer;display:grid;place-items:center;line-height:1;transition:transform .08s}
.biaya-del:active{transform:scale(.92);background:var(--red);color:#fff}

/* Combobox kategori — input + datalist, bisa ketik sendiri */
.kat-combo{position:relative}
.kat-combo input{padding-right:30px}
.kat-combo::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;font-size:14px}
.kat-hint{font-size:11px;color:var(--mut2);margin-top:4px;font-weight:500}

/* Chips kategori — list horizontal, ketuk untuk pilih */
.kat-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.kat-chip{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s;font-family:inherit}
.kat-chip:active{transform:scale(.94)}
.kat-chip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(15,157,107,.3)}
.kat-chip .chip-ic{font-size:14px;line-height:1}
.kat-chip.kat-add{border-style:dashed;color:var(--mut);background:var(--line2)}
.kat-chip.kat-add.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.kat-inline-add{flex-basis:100%;margin-top:8px;display:flex;gap:8px;align-items:center;padding:10px;background:var(--pri-l);border-radius:11px}
.kat-inline-add input{flex:1;padding:9px 12px;border:1px solid var(--pri);border-radius:9px;font-size:13px;background:#fff;outline:none}
.kat-inline-add input:focus{box-shadow:0 0 0 3px var(--pri-l)}

/* Tombol hapus kecil di baris kategori custom */
.kat-del{width:28px;height:28px;border-radius:8px;background:var(--red-l);color:var(--red);font-size:16px;font-weight:700;border:0;cursor:pointer;display:grid;place-items:center;line-height:1;margin-right:6px;flex-shrink:0;transition:transform .08s}
.kat-del:active{transform:scale(.9);background:var(--red);color:#fff}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div>
    <div class="lg">S</div>
    <b>SmartFin Bisnis</b>
    <p>Catat pemasukan &amp; pengeluaran usaha</p>
  </div>
</div>

<div class="login" id="loginView">
  <div class="c">
    <div class="lg">S</div>
    <b style="font-size:18px">SmartFin Bisnis</b>
    <p style="font-size:13px;color:#8a98ab;margin:6px 0 14px">Masukkan sandi untuk membuka data</p>
    <div class="fld" style="text-align:left"><label>Sandi</label><input id="_lgPwd" type="password" autocomplete="current-password" placeholder="Sandi aplikasi"></div>
    <div class="fld" id="_lgCWrap" style="display:none;text-align:left"><label>Ulangi sandi (atur pertama kali)</label><input id="_lgC" type="password" autocomplete="new-password"></div>
    <div id="_lgErr" style="display:none;color:#d93b3b;font-size:12.5px;font-weight:600;margin-bottom:8px"></div>
    <button class="btn block" id="_lgBtn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <div class="topbar">
    <div class="brand">
      <div class="lg">S</div>
      <div><b>SmartFin Bisnis</b><small id="usrNama">Usaha Anda</small></div>
    </div>
    <div style="flex:1"></div>
    <button class="bell" id="bellBtn" onclick="vibrate(12);openAlerts()" aria-label="Notifikasi">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="bdg" id="bellBdg">0</span>
    </button>
  </div>

  <main class="wrap">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-riwayat"></section>
    <section class="view" id="v-tabungan"></section>
    <section class="view" id="v-pengaturan"></section>
  </main>
</div>

<button class="fab" id="fab" hidden onclick="vibrate(15);openAddPicker()">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="navbot" id="navBot"></nav>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div id="sheetBody"></div>
</div>

<div id="toast"></div>

<script>
/* ===================== HELPERS ===================== */
function $(i){ return document.getElementById(i); }
const R = n => 'Rp' + (Math.round(+n||0)).toLocaleString('id-ID');
const E = s => String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const L = (k,v) => { try{ return v===undefined ? JSON.parse(localStorage.getItem(k)) : localStorage.setItem(k,JSON.stringify(v)); }catch(e){return null;} };
const uid = p => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const todayISO = () => new Date().toISOString().slice(0,10);
const monthKey = d => (d||new Date()).toISOString().slice(0,7);
const fmtDate = d => { if(!d) return '-'; const x=new Date(d); if(isNaN(x)) return String(d); return x.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); };
const rp2num = s => +String(s||'').replace(/[^\d]/g,'') || 0;
const daysUntil = d => { if(!d) return Infinity; const x=new Date(d); x.setHours(0,0,0,0); const n=new Date(); n.setHours(0,0,0,0); return Math.round((x-n)/86400000); };
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS_L = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let S = { tab:'home', d:null, q:[], hasPwd:null };
const D = () => S.d || (S.d = normalizeD(L('sf_d') || KOSONG));

function vibrate(p){ try{ if(D().pengaturan.getar!==false && navigator.vibrate) navigator.vibrate(p||12); }catch(e){} }
function toast(m,e){ const t=$('toast'); t.textContent=m; t.style.background=e===2?'#e8780a':e?'#d93b3b':'#0f9d6b'; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2600); }

/* ===================== DATA MODEL ===================== */
/* Kategori: 3 tipe — in (pemasukan), out (pengeluaran), sav (tabungan/dana darurat) */
const DEF_KAT = [
  {id:'k1', nama:'Penjualan',      tipe:'in',  ikon:'🏪', warna:'#0f9d6b'},
  {id:'k2', nama:'Jasa/Layanan',   tipe:'in',  ikon:'🧾', warna:'#34d399'},
  {id:'k3', nama:'Modal Usaha',    tipe:'in',  ikon:'💼', warna:'#10b981'},
  {id:'k4', nama:'Pemasukan Lain', tipe:'in',  ikon:'➕', warna:'#22c55e'},
  {id:'k10',nama:'Makan',          tipe:'out', ikon:'🍽️', warna:'#ef4444'},
  {id:'k11',nama:'Belanja Stok',   tipe:'out', ikon:'🛒', warna:'#f97316'},
  {id:'k12',nama:'Transportasi',   tipe:'out', ikon:'🛵', warna:'#e8780a'},
  {id:'k13',nama:'Tagihan',        tipe:'out', ikon:'🧾', warna:'#2f6fd6'},
  {id:'k14',nama:'Gaji Karyawan',  tipe:'out', ikon:'👥', warna:'#a855f7'},
  {id:'k15',nama:'Operasional',    tipe:'out', ikon:'⚙️', warna:'#06b6d4'},
  {id:'k16',nama:'Lain-lain',      tipe:'out', ikon:'📦', warna:'#8a98ab'},
  {id:'k20',nama:'Dana Darurat',   tipe:'sav', ikon:'🛡️', warna:'#0f9d6b'},
  {id:'k21',nama:'Investasi',      tipe:'sav', ikon:'📈', warna:'#2f6fd6'},
  {id:'k22',nama:'Tabungan Lain',  tipe:'sav', ikon:'🐷', warna:'#7c5fd6'}
];

const DEF_BIAYA = [
  {id:'b1', nama:'Makan & Minum',    jumlah:1500000},
  {id:'b2', nama:'Sewa',             jumlah:2500000},
  {id:'b3', nama:'Listrik & Air',    jumlah:500000},
  {id:'b4', nama:'Transportasi',     jumlah:600000},
  {id:'b5', nama:'Gaji Karyawan',    jumlah:3000000},
  {id:'b6', nama:'Kebutuhan Lain',   jumlah:800000}
];

const DEF_SET = {
  nama:'Usaha Saya',
  jenisUsaha:'Lainnya',
  bulanDarurat:6,   // target ketahanan dana darurat (bulan)
  biayaHidup: DEF_BIAYA.slice(),
  getar:true
};

const KOSONG = {
  ver:4,
  kategori: DEF_KAT.slice(),
  transaksi: [],
  pengaturan: JSON.parse(JSON.stringify(DEF_SET))
};

/* === MIGRASI data lama (versi 3) → struktur baru (versi 4) ===
   - Hapus field: rekening, anggaran, tagihan, utang, target, danaDarurat, notifikasi
   - Transaksi: hapus rekening_id/ke_rekening_id; tipe 'transfer' → 'sav' (kategori Dana Darurat)
   - Kategori: rename Gaji/Freelance/Bisnis → Penjualan/Jasa-Layanan/Modal Usaha
   - Pengaturan: ambil biayaHidup dari danaDarurat lama, hapus field tidak relevan */
function normalizeD(d){
  d = d || {};
  d.ver = 4;

  // === KATEGORI ===
  if(!d.kategori || !d.kategori.length){
    d.kategori = DEF_KAT.slice();
  } else {
    // Rename kategori default lama
    const renameMap = {
      'k1':{old:'Gaji',       neu:'Penjualan'},
      'k2':{old:'Freelance',  neu:'Jasa/Layanan'},
      'k3':{old:'Bisnis',     neu:'Modal Usaha'},
      'k4':{old:'Lain-lain',  neu:'Pemasukan Lain'}
    };
    const ikonBaru = {'k1':'🏪','k2':'🧾','k3':'💼','k4':'➕'};
    d.kategori.forEach(k=>{
      const m = renameMap[k.id];
      if(m && k.nama === m.old){
        k.nama = m.neu;
        k.ikon = ikonBaru[k.id];
      }
    });
    // Pastikan kategori sav (k20-k22) ada
    ['k20','k21','k22'].forEach(id=>{
      if(!d.kategori.some(k=>k.id===id)){
        d.kategori.push({...DEF_KAT.find(k=>k.id===id)});
      }
    });
    // Pastikan kategori out baru (k14 Gaji Karyawan, k15 Operasional) ada
    ['k14','k15'].forEach(id=>{
      if(!d.kategori.some(k=>k.id===id)){
        const def = DEF_KAT.find(k=>k.id===id);
        if(def) d.kategori.push({...def});
      }
    });
  }

  // === TRANSAKSI ===
  if(!d.transaksi) d.transaksi = [];
  d.transaksi.forEach(t=>{
    // Konversi transfer antar rekening → sav (dana darurat)
    if(t.tipe === 'transfer'){
      t.tipe = 'sav';
      if(!t.kategori_id || !d.kategori.some(k=>k.id===t.kategori_id && k.tipe==='sav')){
        t.kategori_id = 'k20';
      }
      if(!t.deskripsi) t.deskripsi = 'Transfer (migrasi)';
    }
    // Hapus field rekening yang tidak dipakai lagi
    delete t.rekening_id;
    delete t.ke_rekening_id;
  });

  // === HAPUS FIELD LAMA (tapi simpan danaDarurat untuk migrasi biayaHidup dulu) ===
  const _oldDanaDarurat = d.danaDarurat;
  delete d.rekening;
  delete d.anggaran;
  delete d.tagihan;
  delete d.utang;
  delete d.target;
  delete d.danaDarurat;
  delete d.notifikasi;

  // === PENGATURAN ===
  const _oldPengaturan = d.pengaturan || {};
  d.pengaturan = Object.assign(JSON.parse(JSON.stringify(DEF_SET)), _oldPengaturan);

  // Migrasi biayaHidup:
  // - Jika user LAMA punya biayaHidup → pakai itu
  // - Jika tidak, dan ada danaDarurat lama → migrasi dari sana
  // - Jika tidak ada keduanya → pakai default DEF_BIAYA
  if(_oldPengaturan.biayaHidup && _oldPengaturan.biayaHidup.length){
    d.pengaturan.biayaHidup = _oldPengaturan.biayaHidup;
  } else if(_oldDanaDarurat && _oldDanaDarurat.length){
    d.pengaturan.biayaHidup = _oldDanaDarurat.map(x=>({id:uid('b'),nama:x.kategori_kebutuhan,jumlah:+x.jumlah_bulanan||0}));
  } else {
    d.pengaturan.biayaHidup = DEF_BIAYA.slice();
  }

  if(!d.pengaturan.jenisUsaha) d.pengaturan.jenisUsaha = 'Lainnya';
  if(!d.pengaturan.bulanDarurat) d.pengaturan.bulanDarurat = 6;
  // Bersihkan field lama yang tidak dipakai
  delete d.pengaturan.penghasilanBulanan;
  delete d.pengaturan.matauang;
  delete d.pengaturan.alokasi;
  delete d.pengaturan.notif;
  delete d.pengaturan.tenang;
  delete d.pengaturan.danaDaruratRekening;

  return d;
}

function persist(){ L('sf_d', S.d); }

/* ===================== API LAYER ===================== */
const API = 'https://script.google.com/macros/s/AKfycbxzPOqrdjoS_1sitAtcAEUN9FZ59C7b0zgj0yXvfOxlxh1Ludmr2g4a2JZd6ZuSZA/exec';

async function apiRaw(action, body){
  try{
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:L('sf_tok')||'', ...body})});
    return JSON.parse(await r.text());
  }catch(e){ return null; }
}
async function apiSync(action, body){
  try{
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:L('sf_tok')||'', ...body})});
    const j = JSON.parse(await r.text());
    if(j && j.needLogin){ if(window._st){ clearInterval(window._st); window._st=null; } showLogin('Sesi berakhir — masuk lagi'); return null; }
    return (j && j.ok) ? j : null;
  }catch(e){ return null; }
}
function persistQ(){ L('sf_q', S.q); }
function pushQ(op){ S.q.push(op); persistQ(); flush(); }
let _f=false;
async function flush(){
  if(_f || !navigator.onLine || !S.q.length) return;
  _f=true;
  try{
    const b = S.q.slice(0, 25);
    const j = await apiSync('sync', {ops: b});
    if(j){ S.q = S.q.slice(b.length); persistQ(); }
  }catch(e){}
  _f=false;
  // Setelah queue kosong, hapus flag resetPending & pull data terbaru
  if(S.q.length === 0 && L('sf_resetPending')){
    L('sf_resetPending', false);
    pull();
  }
}
async function pull(){
  if(S.q.length || !navigator.onLine) return;
  // Jangan pull kalau reset belum selesai sync ke backend
  if(L('sf_resetPending')) return;
  const j = await apiSync('data', {});
  const d = j && j.d;
  if(d && d.transaksi && d.transaksi.length){
    S.d = normalizeD(d); L('sf_d', S.d); renderAll();
  }
}
function syncNow(){ flush(); if(!S.q.length && !L('sf_resetPending')) pull(); }

/* ===================== LOGIN / BOOT ===================== */
async function boot(){
  S.q = L('sf_q') || [];
  setTimeout(()=>{ $('splash').style.display='none'; }, 400);
  const st = await apiRaw('status', {});
  if(!st || !st.ok){ showLogin('Server tidak terjangkau. Periksa internet lalu coba lagi.', true); return; }
  S._hasPwd = !!st.hasPassword;
  if(!L('sf_tok')){ showLogin(); return; }
  enterApp();
}
function showLogin(msg, retry){
  $('splash').style.display='none';
  $('app').hidden=true; S.d=null;
  if(window._st){ clearInterval(window._st); window._st=null; }
  $('loginView').style.display='flex';
  const first = S._hasPwd===false;
  $('_lgCWrap').style.display = first?'block':'none';
  const b=$('_lgBtn');
  b.textContent = retry?'Coba lagi':(first?'Atur sandi & mulai':'Masuk');
  b.onclick = retry?boot:doLogin;
  const e=$('_lgErr');
  e.textContent=msg||''; e.style.display=msg?'block':'none';
  setTimeout(()=>{ try{ $('_lgPwd').focus(); }catch(err){} }, 120);
}
async function doLogin(){
  const pw=$('_lgPwd').value, first = S._hasPwd===false;
  const err=m=>{ const e=$('_lgErr'); e.textContent=m; e.style.display='block'; };
  if(!pw){ err('Isi sandi dulu'); return; }
  if(pw.length<4){ err('Sandi minimal 4 karakter'); return; }
  if(first && pw!==$('_lgC').value){ err('Konfirmasi sandi tidak sama'); return; }
  const b=$('_lgBtn'); b.disabled=true; b.textContent='Memproses…';
  const j=await apiRaw('login', {password:pw});
  b.disabled=false;
  if(!j){ err('Server tidak terjangkau — coba lagi'); return; }
  if(!j.ok){ err(j.err||j.error||'Sandi salah'); return; }
  L('sf_tok', j.token);
  S._hasPwd=true;
  $('_lgPwd').value=''; $('_lgC').value='';
  enterApp();
}
function enterApp(){
  S.d = normalizeD(L('sf_d') || KOSONG);
  $('loginView').style.display='none';
  $('app').hidden=false;
  buildNav();
  go('home');
  syncNow();
  if(!window._st){ window._st=setInterval(syncNow, 60000); addEventListener('online', syncNow); }
}

/* ===================== MUTASI DATA ===================== */
function mutate(tipe, op, row){
  if(!S.d) S.d = normalizeD(L('sf_d') || KOSONG);
  if(tipe==='pengaturan'){
    S.d.pengaturan = row;
  } else {
    const arr = S.d[tipe] || (S.d[tipe]=[]);
    if(op==='add') arr.unshift(row);
    else if(op==='upd'){ const i=arr.findIndex(x=>x.id===row.id); if(i>=0) arr[i]=row; }
    else if(op==='del'){ const i=arr.findIndex(x=>x.id===row.id); if(i>=0) arr.splice(i,1); }
  }
  persist();
  pushQ({t:tipe, op, id:row&&row.id, row});
  renderAll();
}
function savePengaturan(){ persist(); pushQ({t:'pengaturan', op:'set', row:S.d.pengaturan}); renderAll(); }

/* ===================== SMART LOGIC ===================== */
const KAT = id => (D().kategori.find(k=>k.id===id) || {nama:'?',ikon:'•',warna:'#8a98ab',tipe:'out'});

function trxByMonth(mk){ return D().transaksi.filter(t=>String(t.tgl).slice(0,7)===mk); }
function trxByDay(d){ return D().transaksi.filter(t=>t.tgl===d); }
function sumIn(trxs){ return trxs.filter(t=>t.tipe==='in').reduce((a,t)=>a+(+t.jumlah||0),0); }
function sumOut(trxs){ return trxs.filter(t=>t.tipe==='out').reduce((a,t)=>a+(+t.jumlah||0),0); }
function sumSav(trxs){ return trxs.filter(t=>t.tipe==='sav').reduce((a,t)=>a+(+t.jumlah||0),0); }

function saldoTotal(){
  // Total saldo = pemasukan - pengeluaran (tabungan tidak mengurangi, hanya dialokasikan ke pos terpisah)
  let s = 0;
  D().transaksi.forEach(t=>{
    if(t.tipe==='in') s += +t.jumlah;
    else if(t.tipe==='out') s -= +t.jumlah;
    // sav: tidak mengurangi saldo total
  });
  return s;
}
function saldoTersedia(){
  // Saldo yang masih bisa dipakai harian = total - yang sudah dialokasikan ke tabungan
  return saldoTotal() - totalTabungan();
}
function totalTabungan(){
  return D().transaksi.filter(t=>t.tipe==='sav').reduce((a,t)=>a+(+t.jumlah||0),0);
}
function danaDaruratSaldo(){
  // Hanya kategori "Dana Darurat" (k20) atau kategori sav lain yg namanya mirip
  return D().transaksi.filter(t=>{
    if(t.tipe!=='sav') return false;
    const k = KAT(t.kategori_id);
    return k.nama === 'Dana Darurat' || /darurat|emergency/i.test(k.nama);
  }).reduce((a,t)=>a+(+t.jumlah||0),0);
}
function biayaBulanan(){
  return (D().pengaturan.biayaHidup||[]).reduce((a,x)=>a+(+x.jumlah||0),0);
}
function penghasilanInfo(){
  // Estimasi pemasukan dari rata-rata 6 bulan terakhir yang ada pemasukan
  let sum=0, cnt=0, detail=[];
  for(let i=0;i<6;i++){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const mk=d.toISOString().slice(0,7);
    const sv=sumIn(trxByMonth(mk));
    if(sv>0){ sum+=sv; cnt++; detail.push({mk, val:sv}); }
  }
  if(cnt>0) return {v:Math.round(sum/cnt), src:'estimasi', bulan:cnt, detail};
  return {v:0, src:'belum-ada', bulan:0, detail:[]};
}
function pemasukanVariansi(){
  const inc=penghasilanInfo();
  if(!inc.detail || inc.detail.length<2) return {cv:0, fluktuatif:false, mean:0};
  const vals=inc.detail.map(x=>x.val);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  if(mean<=0) return {cv:0, fluktuatif:false, mean:0};
  const variance=vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;
  const cv=Math.sqrt(variance)/mean;
  return {cv, fluktuatif: cv>0.4, mean};
}
function calcEmergency(){
  const beban = biayaBulanan();
  const dana = danaDaruratSaldo();
  const bulanTarget = D().pengaturan.bulanDarurat || 6;
  const varP = pemasukanVariansi();
  // Untuk bisnis fluktuatif, target minimal 9 bln
  const bulanIdeal = varP.fluktuatif ? Math.max(bulanTarget, 9) : bulanTarget;
  const target = beban * bulanIdeal;
  const targetMin = beban * 3;
  const rasio = beban>0 ? dana/beban : 0;
  const bulanTahan = beban>0 ? dana/beban : 0;
  const sisa = Math.max(0, target - dana);
  const pct = target>0 ? Math.min(100, Math.round(dana/target*100)) : 0;
  let status, cls, emoji;
  if(beban===0){ status='Belum diisi'; cls='a'; emoji='⚙️'; }
  else if(rasio<1){ status='Kritis'; cls='r'; emoji='🆘'; }
  else if(rasio<3){ status='Belum Aman'; cls='a'; emoji='⚠️'; }
  else if(rasio<bulanIdeal){ status='Cukup'; cls='a'; emoji='🛡️'; }
  else { status='Aman'; cls='g'; emoji='✅'; }
  return {beban, dana, target, targetMin, bulanIdeal, bulanTarget, rasio, bulanTahan, sisa, pct, status, cls, emoji, varP};
}
function rekomDanaDarurat(){
  const ef = calcEmergency();
  const inc = penghasilanInfo();
  const sisa = ef.sisa;
  const kapasitas = inc.v>0 ? inc.v - ef.beban : 0;
  // Saran: 20% pemasukan, 30% kalau belum aman
  let saran = inc.v>0 ? Math.floor(inc.v*0.20/50000)*50000 : 0;
  if(ef.rasio<3 && inc.v>0) saran = Math.floor(inc.v*0.30/50000)*50000;
  if(saran<=0 && sisa>0) saran = 500000;
  if(kapasitas>0 && saran>kapasitas) saran = Math.floor(kapasitas/50000)*50000;
  const etaBulan = saran>0 ? Math.ceil(sisa/saran) : null;
  let etaTgl = null;
  if(etaBulan!=null){ const d=new Date(); d.setMonth(d.getMonth()+etaBulan); etaTgl=MONTHS[d.getMonth()]+' '+d.getFullYear(); }
  return {ef, inc, sisa, kapasitas, saran, etaBulan, etaTgl};
}
function hasData(){
  return D().transaksi.length>0 || biayaBulanan()>0;
}

/* ===================== TIPS HARIAN CANGGIH =====================
   Tip adaptif ke kondisi aktual bisnis user.
   Prioritas: belum ada data → bisnis sepi → surplus → pengeluaran besar
              → dana darurat belum aman → pemasukan fluktuatif → default hemat */
function tipHarian(){
  const today = todayISO();
  const mkNow = monthKey();
  const masukHariIni = sumIn(trxByDay(today));
  const keluarHariIni = sumOut(trxByDay(today));
  const savHariIni = sumSav(trxByDay(today));
  const inc = penghasilanInfo();
  const ef = calcEmergency();
  const rk = rekomDanaDarurat();
  const masukBulanIni = sumIn(trxByMonth(mkNow));

  // 1) Belum ada data
  if(D().transaksi.length === 0){
    return {em:'👋', j:'Mulai catat usaha Anda', p:'Catat <b>pemasukan pertama</b> hari ini — bisa penjualan, jasa, atau modal usaha. SmartFin akan menghitung estimasi pemasukan &amp; rekomendasi dana darurat otomatis dari catatan Anda.'};
  }

  // 2) Bisnis sepi — tidak ada pemasukan 3+ hari
  const ins = D().transaksi.filter(t=>t.tipe==='in').sort((a,b)=>a.tgl<b.tgl?1:-1);
  if(ins.length){
    const last = ins[0];
    const days = Math.floor((new Date(today) - new Date(last.tgl))/86400000);
    if(days >= 3){
      const tahan = ef.beban>0 ? ef.bulanTahan.toFixed(1) : '?';
      return {em:'🐌', j:'Bisnis sepi '+days+' hari', p:'Tidak ada pemasukan '+days+' hari terakhir. <b>Prioritas: tahan pengeluaran tidak wajib</b>, jangan sentuh dana darurat dulu (tahan '+tahan+' bln). Cari penjualan kecil harian untuk cashflow tetap jalan.'};
    }
  }

  // 3) Hari surplus besar
  if(masukHariIni > 0 && masukHariIni > keluarHariIni*3){
    const sisihkan = Math.round(masukHariIni*0.20);
    return {em:'🎉', j:'Hari surplus!', p:'Pemasukan hari ini '+R(masukHariIni)+' jauh di atas pengeluaran. <b>Sisihkan '+R(sisihkan)+' (20%) ke dana darurat</b> sebelum dipakai lain. Kalau dana darurat sudah aman, masuk ke investasi.'};
  }

  // 4) Pengeluaran besar hari ini
  if(keluarHariIni > masukHariIni*1.5 && keluarHariIni > 100000){
    return {em:'⚠️', j:'Pengeluaran tinggi hari ini', p:'Pengeluaran '+R(keluarHariIni)+' vs pemasukan '+R(masukHariIni)+'. Besok tunda pengeluaran operasional yang tidak mendesak. Stok boleh beli kalau memang untuk penjualan.'};
  }

  // 5) Dana darurat belum aman
  if(ef.beban>0 && ef.rasio<3){
    const saranTxt = rk.saran>0 ? 'Sisihkan <b>'+R(rk.saran)+'/bln</b>'+(
      inc.v>0 ? ' ('+Math.round(rk.saran/inc.v*100)+'% pemasukan)' : ''
    )+' → tercapai ±'+rk.etaBulan+' bln.' : 'Catat pemasukan dulu agar saran setoran muncul.';
    return {em:'🛡️', j:'Prioritas: dana darurat', p:'Dana darurat baru tahan '+ef.bulanTahan.toFixed(1)+' bln (target '+ef.bulanIdeal+' bln). '+saranTxt};
  }

  // 6) Pemasukan fluktuatif
  if(ef.varP && ef.varP.fluktuatif){
    return {em:'📊', j:'Pemasukan fluktuatif', p:'Variasi pemasukan tinggi (CV '+(ef.varP.cv*100).toFixed(0)+'%). Target dana darurat dinaikkan ke '+ef.bulanIdeal+' bulan untuk pengaman. Konsisten sisihkan <b>persentase pemasukan</b>, bukan nominal tetap.'};
  }

  // 7) Hari ini belum catat apa-apa
  if(masukHariIni===0 && keluarHariIni===0 && savHariIni===0){
    return {em:'✍️', j:'Catat transaksi hari ini', p:'Belum ada catatan hari ini. Catat semua pemasukan &amp; pengeluaran — walau kecil — agar estimasi pemasukan bulanan makin akurat.'};
  }

  // 8) Sudah menabung hari ini
  if(savHariIni > 0){
    return {em:'💪', j:'Hebat! Sudah menabung hari ini', p:'Anda sisihkan '+R(savHariIni)+' ke tabungan/dana darurat hari ini. Pertahankan konsistensi — ini kunci bisnis sehat.'};
  }

  // 9) Pemasukan bulan ini mendekati estimasi
  if(inc.v>0 && masukBulanIni >= inc.v*0.8){
    return {em:'📈', j:'Pemasukan bulan ini bagus', p:'Sudah capai '+Math.round(masukBulanIni/inc.v*100)+'% estimasi pemasukan bulanan. Sempurna untuk tambah dana darurat atau investasi.'};
  }

  // 10) Default — tips hemat harian
  const tips = [
    'Pisahkan uang usaha &amp; pribadi. Bayar diri sendiri sebagai <b>persentase pemasukan</b>, bukan ambil sesuka hati.',
    'Sisihkan <b>minimal 10% pemasukan</b> ke dana darurat sebelum belanja apa pun — "bayar diri sendiri dulu".',
    'Catat transaksi <b>hari ini juga</b>, jangan ditunda. Ingatan manusia cepat lupa, apalagi untuk nominal kecil.',
    'Tinjau pengeluaran mingguan: jika kategori "Lain-lain" dominan, pecah jadi kategori spesifik agar kelihatan pola.',
    'Simpan dana darurat di <b>rekening terpisah</b> agar tidak terpakai untuk operasional sehari-hari.',
    'Pengeluaran stok barang = investasi (pemasukan masa depan). Pengeluaran konsumtif = beban. Bedakan keduanya.'
  ];
  const idx = Math.floor(new Date().getDate() / 5) % tips.length;
  return {em:'💡', j:'Tips hemat harian', p:tips[idx]};
}

/* ===================== ALERTS PINTAR (loceng notifikasi) =====================
   Daftar peringatan adaptif berdasarkan kondisi aktual bisnis user.
   Tiap alert: {em, j (judul), p (pesan), cls (warna), tipe (action)} */
function generateAlerts(){
  const today = todayISO();
  const mkNow = monthKey();
  const masukHariIni = sumIn(trxByDay(today));
  const keluarHariIni = sumOut(trxByDay(today));
  const inc = penghasilanInfo();
  const ef = calcEmergency();
  const rk = rekomDanaDarurat();
  const masukBulanIni = sumIn(trxByMonth(mkNow));
  const keluarBulanIni = sumOut(trxByMonth(mkNow));
  const out = [];

  if(D().transaksi.length === 0){
    out.push({em:'👋', j:'Mulai catat usaha', p:'Catat <b>pemasukan pertama</b> hari ini agar SmartFin bisa memberi rekomendasi.', cls:'b', tipe:'add-in'});
    return out;
  }

  // 1) Dana darurat kritis
  if(ef.beban>0 && ef.rasio<1){
    out.push({em:'🆘', j:'Dana darurat kritis', p:'Hanya tahan <b>'+ef.bulanTahan.toFixed(1)+' bulan</b> tanpa pemasukan. Target '+ef.bulanIdeal+' bln = '+R(ef.target)+'.', cls:'r', tipe:'go-tabungan'});
  } else if(ef.beban>0 && ef.rasio<3){
    out.push({em:'🛡️', j:'Dana darurat belum aman', p:ef.pct+'% dari target '+ef.bulanIdeal+' bln. Sisihkan <b>'+R(rk.saran)+'/bln</b> → tercapai ±'+rk.etaBulan+' bln.', cls:'a', tipe:'go-tabungan'});
  }

  // 2) Bisnis sepi 3+ hari
  const ins = D().transaksi.filter(t=>t.tipe==='in').sort((a,b)=>a.tgl<b.tgl?1:-1);
  if(ins.length){
    const last = ins[0];
    const days = Math.floor((new Date(today) - new Date(last.tgl))/86400000);
    if(days >= 3){
      out.push({em:'🐌', j:'Bisnis sepi '+days+' hari', p:'Tidak ada pemasukan '+days+' hari terakhir. <b>Tahan pengeluaran tidak wajib</b>, jangan sentuh dana darurat.', cls:'a', tipe:'go-riwayat'});
    } else if(days >= 1 && masukHariIni===0){
      out.push({em:'⏰', j:'Belum ada pemasukan hari ini', p:'Pemasukan terakhir '+days+' hari lalu. Catat penjualan/jasa hari ini.', cls:'b', tipe:'add-in'});
    }
  }

  // 3) Pemasukan < beban bulanan (defisit)
  if(inc.v>0 && ef.beban>0 && inc.v < ef.beban){
    out.push({em:'📉', j:'Pemasukan di bawah beban', p:'Estimasi '+R(inc.v)+'/bln vs beban '+R(ef.beban)+'/bln → <b>defisit '+R(ef.beban-inc.v)+'</b>. Tingkatkan penjualan atau tekan pengeluaran.', cls:'r', tipe:'go-home'});
  }

  // 4) Pengeluaran bulan ini > pemasukan bulan ini
  if(masukBulanIni>0 && keluarBulanIni > masukBulanIni){
    out.push({em:'⚠️', j:'Pengeluaran melebihi pemasukan', p:'Bulan ini: keluar '+R(keluarBulanIni)+' vs masuk '+R(masukBulanIni)+'. <b>Defisit '+R(keluarBulanIni-masukBulanIni)+'</b>. Kurangi pengeluaran tidak wajib.', cls:'a', tipe:'go-riwayat'});
  }

  // 5) Pengeluaran tinggi hari ini
  if(keluarHariIni > masukHariIni*1.5 && keluarHariIni > 100000){
    out.push({em:'💸', j:'Pengeluaran tinggi hari ini', p:'Hari ini keluar '+R(keluarHariIni)+' vs masuk '+R(masukHariIni)+'. Besok tunda pengeluaran tidak mendesak.', cls:'a', tipe:'go-riwayat'});
  }

  // 6) Hari surplus — peluang sisihkan
  if(masukHariIni > 0 && masukHariIni > keluarHariIni*3){
    const s = Math.round(masukHariIni*0.20);
    out.push({em:'🎉', j:'Hari surplus — sisihkan!', p:'Pemasukan '+R(masukHariIni)+' jauh di atas pengeluaran. <b>Setor '+R(s)+' (20%) ke dana darurat</b> sekarang.', cls:'g', tipe:'add-sav'});
  }

  // 7) Pemasukan fluktuatif
  if(ef.varP && ef.varP.fluktuatif && inc.bulan>=2){
    out.push({em:'📊', j:'Pemasukan fluktuatif', p:'Variasi tinggi (CV '+(ef.varP.cv*100).toFixed(0)+'%). Target dana darurat dinaikkan ke '+ef.bulanIdeal+' bln. Sisihkan <b>persentase</b>, bukan nominal tetap.', cls:'b', tipe:'go-tabungan'});
  }

  // 8) Belum catat apa-apa hari ini
  if(masukHariIni===0 && keluarHariIni===0 && sumSav(trxByDay(today))===0){
    out.push({em:'✍️', j:'Belum catat hari ini', p:'Catat semua pemasukan & pengeluaran hari ini, walau kecil, agar estimasi makin akurat.', cls:'b', tipe:'add-in'});
  }

  // 9) Sudah capai estimasi bulanan
  if(inc.v>0 && masukBulanIni >= inc.v*0.8 && masukBulanIni < inc.v){
    out.push({em:'📈', j:'Hampir capai estimasi bulanan', p:'Sudah '+Math.round(masukBulanIni/inc.v*100)+'% estimasi pemasukan bulanan. Sisihkan surplus ke dana darurat.', cls:'g', tipe:'go-tabungan'});
  } else if(inc.v>0 && masukBulanIni >= inc.v){
    out.push({em:'🎯', j:'Capai estimasi bulanan!', p:'Pemasukan bulan ini '+R(masukBulanIni)+' sudah mencapai estimasi '+R(inc.v)+'. Sempurna untuk tambah tabungan.', cls:'g', tipe:'go-tabungan'});
  }

  // 10) Tips harian default (kalau tidak ada alert lain)
  if(out.length === 0){
    const tip = tipHarian();
    out.push({em:tip.em, j:tip.j, p:tip.p, cls:'b', tipe:'none'});
  }

  return out;
}

  const bell = $('bellBtn');

  if(!bell || !bdg) return;
  bell.classList.toggle('has', n>0);

  const alerts = generateAlerts();

    body = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Tidak ada peringatan.<br>Keuangan Anda terpantau baik.</div>';
  } else {
    body = '<div class="muted xs" style="margin-bottom:10px">'+alerts.length+' peringatan aktif berdasarkan kondisi usaha Anda hari ini.</div>';
    body += alerts.map(a=>'<div class="alert '+a.cls+'"><div class="em">'+a.em+'</div><div class="bd"><div class="t">'+a.j+'</div><div class="m">'+a.p+'</div></div></div>').join('');

}

}

/* ===================== RIWAYAT ===================== */
window._riwayatFilter = 'all';
function renderRiwayat(){
  let trxs = D().transaksi.slice().sort((a,b)=> a.tgl<b.tgl?1:(a.tgl>b.tgl?-1:0) );
  const filter = window._riwayatFilter;
  if(filter!=='all') trxs = trxs.filter(t=>t.tipe===filter);
  const totalAll = trxs.reduce((a,t)=>a+(t.tipe==='in'?+t.jumlah:-(t.tipe==='out'?+t.jumlah:0)),0);

  const filterBtns = ['all|Semua','in|Masuk','out|Keluar','sav|Tabungan'].map(x=>{
    const [v,l]=x.split('|');
    return '<button class="'+(filter===v?'on':'')+'" onclick="vibrate(8);window._riwayatFilter=\''+v+'\';renderRiwayat()">'+l+'</button>';
  }).join('');

  // Group by tanggal
  const groups = {};
  trxs.forEach(t=>{ (groups[t.tgl] = groups[t.tgl]||[]).push(t); });
  const sortedDates = Object.keys(groups).sort((a,b)=>a<b?1:-1);

  let listHTML = '';
  if(trxs.length===0){
    listHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/></svg>Belum ada transaksi.<br>Ketuk tombol + untuk mencatat.</div>';
  } else {
    listHTML = sortedDates.map(d=>{
      const items = groups[d];
      const sum = items.reduce((a,t)=>a+(t.tipe==='in'?+t.jumlah:-(+t.jumlah)),0);
      const sumFmt = sum>=0 ? '+'+R(sum) : '−'+R(Math.abs(sum));
      return '<div style="margin-bottom:14px">'+
        '<div class="between xs" style="margin-bottom:6px"><span class="muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px">'+fmtDate(d)+'</span><span class="muted" style="font-weight:700">'+sumFmt+'</span></div>'+
        '<div class="card tight" style="padding:6px 14px;margin:0">'+
          items.map(t=>{
            const k=KAT(t.kategori_id);
            const cls = t.tipe==='in'?'in':t.tipe==='sav'?'sav':'out';
            const sign = t.tipe==='in'?'+':t.tipe==='sav'?'→':'−';
            return '<div class="li"><div class="ic" style="background:'+k.warna+'22">'+k.ikon+'</div><div class="grow"><div class="nm">'+E(t.deskripsi||k.nama)+'</div><div class="sb">'+k.nama+'</div></div><div class="v '+cls+'">'+sign+' '+R(t.jumlah)+'</div></div>';
          }).join('')+
        '</div>'+
      '</div>';
    }).join('');
  }

  $('v-riwayat').innerHTML = ''+
    '<div class="hdr">Riwayat<div class="sub">'+trxs.length+' transaksi</div></div>'+
    '<div class="tabs">'+filterBtns+'</div>'+
    listHTML;
}

  const totalSav = tabPerKat.reduce((a,k)=>a+k.total,0);

  $('v-tabungan').innerHTML = ''+

    '<div class="card">'+

function exportJSON(){
  const blob=new Blob([JSON.stringify(D(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='smartfin-bisnis-'+todayISO()+'.json'; a.click();
  toast('Backup terunduh');
}
function importJSON(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ S.d=normalizeD(JSON.parse(r.result)); persist(); renderAll(); toast('Data dipulihkan'); }catch(err){toast('File tidak valid',1);} };
    r.readAsText(f);
  };
  i.click();
}
function resetData(){
  if(!confirm('Reset SEMUA data? Tindakan ini tidak bisa dibatalkan.'))return;
  vibrate([20,40,20]);
  // 1. Kumpulkan delete ops untuk SEMUA transaksi di backend
  const oldD = S.d || D();
  const ops = [];
  (oldD.transaksi || []).forEach(t => {
    ops.push({t:'transaksi', op:'del', id: t.id, row: {id: t.id}});
  });
  // 2. Reset pengaturan ke default di backend
  ops.push({t:'pengaturan', op:'set', row: JSON.parse(JSON.stringify(DEF_SET))});
  // 3. Masukkan ke queue sync
  S.q = (S.q || []).concat(ops);
  persistQ();
  // 4. Set flag: blok pull() sampai semua delete ops terkirim
  L('sf_resetPending', true);
  // 5. Clear data lokal
  localStorage.removeItem('sf_d');
  S.d = JSON.parse(JSON.stringify(KOSONG));
  persist();
  // 6. Trigger sync langsung
  flush();
  renderAll();
  go('home');
  toast(ops.length>1 ? 'Data dikosongkan — '+ops.length+' perubahan sedang dikirim ke server' : 'Data dikosongkan');
}

/* Cari kategori by nama, kalau tidak ada → buat baru (utility, dipakai untuk import/migration) */
function findOrCreateKat(namaInput, tipe){
  // Strip emoji prefix (cth: "🛡️ Dana Darurat" → "Dana Darurat")
  let nama = String(namaInput||'').trim();
  // Buang emoji/non-text di awal sampai huruf pertama
  nama = nama.replace(/^[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}\s]+/u, '').trim();
  // Kalau setelah strip kosong, pakai input asli
  if(!nama) nama = String(namaInput||'').trim();
  if(!nama) return null;
  // Case-insensitive match
  const existing = D().kategori.find(k=>k.tipe===tipe && k.nama.toLowerCase() === nama.toLowerCase());
  if(existing) return existing.id;
  // Buat kategori baru
  const id = 'kc_' + Date.now().toString(36) + Math.random().toString(36).slice(2,4);
  const ikon = tipe==='in'?'➕':tipe==='sav'?'💰':'📦';
  const warna = tipe==='in'?'#22c55e':tipe==='sav'?'#7c5fd6':'#8a98ab';
  const newKat = {id, nama, tipe, ikon, warna};
  D().kategori.push(newKat);
  // Persist + sync (tanpa renderAll agar form tidak ke-reset)
  persist();
  pushQ({t:'kategori', op:'add', id, row:newKat});
  return id;
}

function delKat(id){
  const k = KAT(id);
  if(!k || k.id!==id){toast('Kategori tidak ditemukan',1);return;}
  // Cegah hapus kategori default
  if(!id.startsWith('kc_')){toast('Kategori default tidak bisa dihapus',1);return;}
  // Cek apakah ada transaksi yang pakai kategori ini
  const trxCount = D().transaksi.filter(t=>t.kategori_id===id).length;
  if(trxCount > 0){
    if(!confirm('Kategori "'+k.nama+'" dipakai oleh '+trxCount+' transaksi.\n\nHapus kategori? Transaksi tetap ada tapi akan tampil dengan kategori "?" sampai diedit manual.'))return;
  } else {
    if(!confirm('Hapus kategori "'+k.nama+'"?'))return;
  }
  mutate('kategori','del',{id});
  toast('Kategori "'+k.nama+'" dihapus');
}
function openAdd(tipe, katId){
  const labelMap = {in:'Pemasukan', out:'Pengeluaran', sav:'Tabungan'};
  const tipeLabel = labelMap[tipe];
  const defaultKat = {in:'k1', out:'k10', sav:'k20'}[tipe];
  const presets = tipe==='in'?[50000,100000,250000,500000,1000000,2000000]:tipe==='sav'?[50000,100000,250000,500000,1000000]:[10000,25000,50000,100000,250000,500000];
  const ph = tipe==='in'?'cth: Penjualan hari ini, jasa desain, modal':tipe==='sav'?'cth: Setor dana darurat, beli reksadana':'cth: Beli stok, makan siang, bayar listrik';

  openSheet('Catat '+tipeLabel, ''+
    '<div class="fld"><label>Tanggal</label><input type="date" id="_fTgl" value="'+todayISO()+'"></div>'+
    katChips(tipe, katId||defaultKat)+
    amtField('_fJml', tipe==='in'?'Berapa uang masuk?':tipe==='sav'?'Berapa disisihkan?':'Berapa uang keluar?', presets)+
    '<div class="fld"><label>Keterangan <span style="color:var(--mut2);font-weight:400">(opsional)</span></label><input id="_fDesc" placeholder="'+ph+'"></div>'+
    '<div class="row" style="gap:8px"><button class="btn ghost grow" onclick="closeSheet()">Batal</button><button class="btn grow" onclick="vibrate(20);saveTrx(\''+tipe+'\')">Simpan</button></div>');
}
function saveTrx(tipe){
  const elJml=$('_fJml');
  if(!elJml){toast('Form belum siap',1);closeSheet();return;}
  const jml=rp2num(elJml.value);
  if(jml<=0){toast('Isi jumlah dulu',1);elJml.focus();return;}
  const katId = $('_fKat').value;
  if(!katId){toast('Pilih kategori dulu',1);return;}
  const row={
    id: uid('trx'),
    tgl: $('_fTgl').value,
    tipe: tipe,
    kategori_id: katId,
    jumlah: jml,
    deskripsi: $('_fDesc').value
  };
  mutate('transaksi','add',row);
  closeSheet();
  const label={in:'Pemasukan',out:'Pengeluaran',sav:'Tabungan'}[tipe];
  toast(label+' dicatat');
}

/* ===================== INIT ===================== */
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('rp')){
    const n=t.value.replace(/[^\d]/g,'');
    t.value = n?(+n).toLocaleString('id-ID'):'';
    // Update total biaya live di form pengaturan
    if(t.closest('#_biayaList')){
      updateBiayaTotal();
    }
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

boot();
</script>
</body>
</html>
